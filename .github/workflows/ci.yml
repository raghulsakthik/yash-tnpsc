name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yash
          POSTGRES_PASSWORD: yash
          POSTGRES_DB: yash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yash -d yash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://yash:yash@localhost:5432/yash
      APP_LEARNER_ID: 00000000-0000-0000-0000-000000000001
      APP_LEARNER_NAME: CI
      APP_LANGUAGE: en

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
      - run: npm run setup
      - run: npm run test:loop
