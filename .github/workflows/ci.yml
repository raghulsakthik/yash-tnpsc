name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yash
          POSTGRES_PASSWORD: yash
          POSTGRES_DB: yash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yash -d yash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://yash:yash@localhost:5432/yash
      APP_LEARNER_ID: 00000000-0000-0000-0000-000000000001
      APP_LEARNER_NAME: CI
      APP_LANGUAGE: en

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify checkout and dependency lock
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch/ref: ${GITHUB_REF}"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); const dep=p.dependencies?.['@opentelemetry/api']||p.devDependencies?.['@opentelemetry/api']; const root=l.packages?.['']?.dependencies?.['@opentelemetry/api']||l.packages?.['']?.devDependencies?.['@opentelemetry/api']; const entry=l.packages?.['node_modules/@opentelemetry/api']; console.log('package.json @opentelemetry/api:',dep||'MISSING'); console.log('lock root @opentelemetry/api:',root||'MISSING'); console.log('lock package entry:',entry?.version||'MISSING'); if(dep!=='1.10.0'||root!=='1.10.0'||entry?.version!=='1.10.0') process.exit(1);"

      - run: npm ci
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
      - run: npm run setup
      - run: npm run test:loop
