name: Content Engine Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Hardening contract
        run: node scripts/content-engine-hardening-check.mjs
