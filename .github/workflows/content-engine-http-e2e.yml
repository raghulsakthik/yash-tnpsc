name: Content Engine Authenticated HTTP E2E

on:
  push:
  pull_request:

jobs:
  authenticated-http-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yash_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yash_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/yash_ci
      APP_LEARNER_ID: 00000000-0000-0000-0000-000000000001
      APP_LANGUAGE: en
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      - name: Validate content
        run: npm run validate:content
      - name: Seed baseline database
        run: npm run db:seed
      - name: Run authenticated HTTP content-engine E2E
        run: node scripts/content-engine-http-e2e.mjs
