  - id: ages-007
    difficulty: 0.20
    estimatedSeconds: 30
    question: "A person is 8 years old today. How old will they be in 5 years?"
    options: ["8", "13", "15", "3"]
    answer: 1
    explanation: "Future age = present age + years ahead = 8 + 5 = 13."
    trap: "Subtracting instead of adding gives a past age, not a future one — check which direction in time the question is asking about."

