# Present/past/future age ratio problems. Directly examined under Aptitude.
questions:

  - id: ages-001
    difficulty: 0.35
    estimatedSeconds: 50
    question: "The ages of two friends are in the ratio 3:1, and the sum of their ages is 16 years. What is the age of the elder friend?"
    options: ["4", "8", "12", "16"]
    answer: 2
    explanation: "Total ratio parts = 3 + 1 = 4. One part = 16 ÷ 4 = 4 years. The elder friend's age = 3 × 4 = 12."
    trap: "Picking the smaller share instead of the elder friend's share answers a different question than the one asked."

