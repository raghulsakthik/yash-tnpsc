topic: aptitude.area
language: en
source: authored
# Requires whole-numbers (area is multiplication at its core). Also the
# prerequisite for volume.
questions:
  - id: area-001
    difficulty: 0.15
    estimatedSeconds: 30
    question: "What is the area of a square with side 9 cm?"
    options: ["36 cm²", "18 cm²", "81 cm²", "90 cm²"]
    answer: 2
    explanation: "Area of a square is side × side: 9 × 9 = 81 cm²."
    trap: "36 cm² is the perimeter (4 × 9), not the area — a very common mix-up between the two formulas."

  - id: area-002
    difficulty: 0.15
    estimatedSeconds: 30
    question: "What is the area of a rectangle with length 12 m and breadth 7 m?"
    options: ["84 m²", "19 m²", "38 m²", "70 m²"]
    answer: 0
    explanation: "Area of a rectangle is length × breadth: 12 × 7 = 84 m²."
    trap: "19 m² adds the length and breadth instead of multiplying them."

  - id: area-003
    difficulty: 0.25
    estimatedSeconds: 40
    question: "Find the area of a triangle with base 16 cm and height 9 cm."
    options: ["144 cm²", "50 cm²", "36 cm²", "72 cm²"]
    answer: 3
    explanation: "Area of a triangle is 1/2 × base × height: 1/2 × 16 × 9 = 72 cm²."
    trap: "144 cm² is base × height without halving — that's the area of a rectangle with the same base and height, not the triangle."

  - id: area-004
    difficulty: 0.30
    estimatedSeconds: 45
    question: "A square has an area of 196 cm². What is the length of its side?"
    options: ["13 cm", "14 cm", "98 cm", "49 cm"]
    answer: 1
    explanation: "The side of a square is the square root of its area: √196 = 14 cm."
    trap: "98 cm halves the area instead of taking its square root — undoing 'side × side' needs a square root, not a division by 2."

  - id: area-005
    difficulty: 0.40
    estimatedSeconds: 55
    question: "Find the area of a circle of radius 14 cm. (Use π = 22/7.)"
    options: ["616 cm²", "440 cm²", "88 cm²", "308 cm²"]
    answer: 0
    explanation: >
      Area of a circle is πr²: 22/7 × 14 × 14 = 22/7 × 196 = 22 × 28 =
      616 cm².
    trap: "308 cm² is exactly half of the correct answer — a sign that r² was accidentally computed as r instead (14 used once rather than twice)."

  - id: area-006
    difficulty: 0.40
    estimatedSeconds: 50
    question: "The length of a rectangle is twice its breadth. If the breadth is 8 m, what is the area?"
    options: ["64 m²", "48 m²", "256 m²", "128 m²"]
    answer: 3
    explanation: "Length = 2 × 8 = 16 m. Area = 16 × 8 = 128 m²."
    trap: "64 m² treats the breadth as if it were also the length — the 'twice the breadth' part of the question gets dropped."

  - id: area-007
    difficulty: 0.50
    estimatedSeconds: 65
    question: "A rectangular field is 40 m long and 25 m wide. Find the cost of levelling it at ₹3 per square metre."
    options: ["₹1,000", "₹1,950", "₹3,000", "₹2,000"]
    answer: 2
    explanation: "Area = 40 × 25 = 1,000 m². Cost = 1,000 × 3 = ₹3,000."
    trap: "₹2,000 comes from a slip in the area calculation rather than the cost step — always re-check 40 × 25 before multiplying by the rate."

  - id: area-008
    difficulty: 0.55
    estimatedSeconds: 60
    question: "The area of a parallelogram is 240 cm² and its base is 20 cm. Find its height."
    options: ["10 cm", "12 cm", "24 cm", "15 cm"]
    answer: 1
    explanation: "Area of a parallelogram is base × height, so height = 240 ÷ 20 = 12 cm."
    trap: "24 cm doubles the correct answer — a sign of mixing up the parallelogram formula (base × height) with the triangle formula (1/2 × base × height) and compensating in the wrong direction."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: area-009
    difficulty: 0.60
    estimatedSeconds: 80
    source: tnpsc-2018
    year: 2018
    question: "Find the area of the iron sheet required to prepare a closed cone 24 cm high with base radius 7 cm. (Use π = 22/7.)"
    options: ["704 cm²", "702 cm²", "700 cm²", "668 cm²"]
    answer: 0
    explanation: >
      Slant height l = √(24² + 7²) = √(576 + 49) = √625 = 25 cm. Total
      surface area = πrl + πr² = (22/7 × 7 × 25) + (22/7 × 7 × 7) =
      550 + 154 = 704 cm².
    trap: "550 cm² (not listed, but a common stopping point) is only the curved surface — a closed cone made from sheet metal needs the circular base too."

  - id: area-010
    difficulty: 0.65
    estimatedSeconds: 90
    source: tnpsc-2018
    year: 2018
    question: "A circus tent is cylindrical to a height of 3 m and conical above it. If the base radius is 52.5 m and the slant height of the cone is 53 m, find the area of canvas required to make the tent."
    options: ["315 π m²", "3097.5 π m²", "2782.5 π m²", "2997.5 π m²"]
    answer: 1
    explanation: >
      Canvas is only the curved surfaces (no floor, and the cylinder-cone
      join isn't covered twice). Cylinder curved surface = 2πrh =
      2 × π × 52.5 × 3 = 315π. Cone curved surface = πrl =
      π × 52.5 × 53 = 2782.5π. Total = 315π + 2782.5π = 3097.5π m².
    trap: "315 π m² is only the cylinder part — the conical roof above it still needs its own curved surface added."

  - id: area-011
    difficulty: 0.50
    estimatedSeconds: 70
    source: tnpsc-2018
    year: 2018
    question: "The area of a square is 1/2 hectare. Find the diagonal of the square. (1 hectare = 10,000 m².)"
    options: ["250 metres", "100 metres", "50√2 metres", "50 metres"]
    answer: 1
    explanation: >
      Area = 1/2 × 10,000 = 5,000 m². The diagonal of a square relates to
      its area by diagonal = √(2 × area) = √10,000 = 100 m.
    trap: "50√2 metres is the diagonal of a square with area 2,500 m² (side 50 m) — a sign of halving the area instead of using the full 5,000 m² figure."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: area-012
    difficulty: 0.55
    estimatedSeconds: 75
    source: tnpsc-2024
    year: 2024
    question: "The curved surface area of a right circular cylinder of height 7 cm is 66 cm². Find the diameter of the cylinder. (Use π = 22/7.)"
    options: ["2 cm", "4 cm", "6 cm", "3 cm"]
    answer: 3
    explanation: >
      Curved surface area = 2πrh: 2 × 22/7 × r × 7 = 66, so 44r = 66,
      giving r = 1.5 cm. The diameter is 2r = 3 cm.
    trap: "6 cm is double the correct answer — a sign of reporting the radius's double (a leftover step) instead of carrying through to the actual diameter, or of a slip that skipped halving somewhere."

  - id: area-013
    difficulty: 0.45
    estimatedSeconds: 60
    source: tnpsc-2024
    year: 2024
    question: "One side of a rectangular field is 15 m and one of its diagonals is 17 m. Find the area of the field."
    options: ["80 m²", "100 m²", "110 m²", "120 m²"]
    answer: 3
    explanation: >
      The other side is √(17² − 15²) = √(289 − 225) = √64 = 8 m. Area =
      15 × 8 = 120 m².
    trap: "110 m² comes from a slip while computing the square root step — recheck that 17² − 15² = 64 exactly, giving a clean side length of 8 m."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: area-014
    difficulty: 0.45
    estimatedSeconds: 60
    source: tnpsc-2015
    year: 2015
    question: "If the length of a rectangle is decreased by 50% and the breadth is increased by 80%, what is the percentage change in the area?"
    options: ["decreased by 10%", "increased by 10%", "decreased by 20%", "increased by 20%"]
    answer: 0
    explanation: >
      New area factor: 0.5 × 1.8 = 0.9, which is 90% of the original —
      a decrease of 10%.
    trap: "increased by 20% simply adds the two raw percentages (−50% and +80%) as if they combined by addition — percentage changes to length and breadth combine by MULTIPLYING their factors, not adding the percentages."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: area-015
    difficulty: 0.40
    estimatedSeconds: 55
    source: tnpsc-2016
    year: 2016
    question: "Find the length of the altitude of an equilateral triangle of side 3√3 cm."
    options: ["27 cm", "9√3 cm", "9 cm", "4.5 cm"]
    answer: 3
    explanation: >
      The altitude of an equilateral triangle is (√3/2) × side:
      (√3/2) × 3√3 = (3 × 3)/2 = 9/2 = 4.5 cm.
    trap: "9 cm drops the division by 2 in the altitude formula — (√3/2) × 3√3 simplifies to 9/2, not 9, since √3 × √3 = 3 cancels the radical before the halving happens."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: area-016
    difficulty: 0.55
    estimatedSeconds: 75
    source: tnpsc-2017
    year: 2017
    question: "Total surface area of hollow hemisphere is equal to"
    options: ["2π(R²+r²) sq. units", "2π(R²−r²) sq. units", "π(3R²+r²) sq. units", "π(3R²−r²) sq. units"]
    answer: 2
    explanation: >
      A hollow hemisphere has three surfaces: the outer curved surface
      2πR², the inner curved surface 2πr², and the flat ring-shaped rim
      connecting them, π(R²−r²). Adding all three: 2πR² + 2πr² +
      πR² − πr² = 3πR² + πr² = π(3R² + r²).
    trap: "2π(R²+r²) sq. units only adds the two curved surfaces (outer and inner) and leaves out the flat ring-shaped rim at the top that a HOLLOW hemisphere's shell also exposes."

  - id: area-017
    difficulty: 0.20
    estimatedSeconds: 30
    source: tnpsc-2017
    year: 2017
    question: "10 sq. m. is equal to"
    options: ["100 sq. cm.", "1000 sq. cm.", "10000 sq. cm.", "100000 sq. cm."]
    answer: 3
    explanation: >
      1 m = 100 cm, so 1 sq. m = 100 × 100 = 10,000 sq. cm. Therefore
      10 sq. m = 10 × 10,000 = 100,000 sq. cm.
    trap: "10000 sq. cm. is the conversion factor for just 1 sq. m, not 10 sq. m — the question's '10' still needs to be multiplied in after converting the units."
