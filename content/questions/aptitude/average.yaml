# Mean of a set of numbers, including a changing-group variant. Directly examined under Aptitude.
questions:

  - id: average-001
    difficulty: 0.25
    estimatedSeconds: 40
    question: "Find the average of: 12, 18, 24, 30, 36."
    options: ["22", "36", "24", "26"]
    answer: 2
    explanation: "Average = sum of all values ÷ count = 120 ÷ 5 = 24."
    trap: "Forgetting to divide by the count after adding (just stating the sum) is the most common slip here."

