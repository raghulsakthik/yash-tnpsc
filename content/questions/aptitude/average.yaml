  - id: average-006
    difficulty: 0.35
    estimatedSeconds: 50
    question: "The average of 20 numbers is 30, and the average of another 25 numbers is 40. What is the average of all of them together?"
    options: ["36.56", "35.56", "35", "34.56"]
    answer: 1
    explanation: "Total of first group = 20 × 30 = 600. Total of second group = 25 × 40 = 1000. Combined average = (600 + 1000) ÷ (20 + 25) = 35.56."
    trap: "Simply averaging the two averages (ignoring that the groups are different sizes) only works when both groups have the same count."

