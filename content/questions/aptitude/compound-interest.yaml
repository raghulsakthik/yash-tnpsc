topic: aptitude.compound-interest
language: en
source: authored
# Requires simple-interest.
questions:
  - id: compound-interest-001
    difficulty: 0.25
    estimatedSeconds: 50
    question: "Find the compound interest on ₹10,000 for 2 years at 10% per annum, compounded annually."
    options: ["₹2,100", "₹2,000", "₹2,200", "₹1,000"]
    answer: 0
    explanation: >
      Amount = 10,000 × 1.10 × 1.10 = ₹12,100. Compound interest =
      12,100 − 10,000 = ₹2,100.
    trap: "₹2,000 is the SIMPLE interest for the same figures (10,000 × 10% × 2) — compound interest earns a little extra because the second year's interest is calculated on ₹11,000, not ₹10,000."

  - id: compound-interest-002
    difficulty: 0.30
    estimatedSeconds: 50
    question: "Find the amount on ₹8,000 for 2 years at 5% per annum, compounded annually."
    options: ["₹8,820", "₹8,800", "₹8,400", "₹8,100"]
    answer: 0
    explanation: >
      Amount = 8,000 × 1.05 × 1.05 = 8,000 × 1.1025 = ₹8,820.
    trap: "₹8,800 adds 5% of 8,000 twice (two flat ₹400 additions) instead of compounding — the second year's 5% is taken on ₹8,400, not on the original ₹8,000 again."

  - id: compound-interest-003
    difficulty: 0.35
    estimatedSeconds: 55
    question: "What is the compound interest on ₹15,000 for 1 year at 8% per annum, compounded half-yearly?"
    options: ["₹1,224", "₹1,200", "₹1,248", "₹1,600"]
    answer: 0
    explanation: >
      Compounding half-yearly means 4% per half-year over 2 periods:
      Amount = 15,000 × 1.04 × 1.04 = 15,000 × 1.0816 = ₹16,224. Compound
      interest = ₹1,224.
    trap: "₹1,200 applies the full 8% once instead of 4% twice — half-yearly compounding uses HALF the annual rate over TWICE the number of periods, not the full rate once."

  - id: compound-interest-004
    difficulty: 0.40
    estimatedSeconds: 60
    question: "The difference between the compound interest and the simple interest on a sum for 2 years at 10% per annum is ₹50. Find the sum."
    options: ["₹5,000", "₹4,500", "₹5,500", "₹6,000"]
    answer: 0
    explanation: >
      For exactly 2 years, CI − SI = P × (R/100)². Here that's P × 0.01 =
      50, so P = ₹5,000.
    trap: "₹6,000 overshoots by guessing a round number close to the right order of magnitude — the 2-year CI-minus-SI shortcut, P × (R/100)², gives an exact value, not an estimate."

  - id: compound-interest-005
    difficulty: 0.45
    estimatedSeconds: 60
    question: "A sum of ₹20,000 becomes ₹24,200 in 2 years at compound interest, compounded annually. Find the rate of interest per annum."
    options: ["10%", "11%", "9%", "12%"]
    answer: 0
    explanation: >
      (1 + r)² = 24,200 / 20,000 = 1.21, so 1 + r = 1.1, giving r = 10%.
    trap: "11% comes from splitting the overall growth (21% over 2 years) in half — but compounding doesn't split evenly like that; the correct step is taking the square root of the growth factor."

  - id: compound-interest-006
    difficulty: 0.55
    estimatedSeconds: 65
    question: "Find the compound interest on ₹6,000 for 3 years at 10% per annum, compounded annually."
    options: ["₹1,986", "₹1,800", "₹2,000", "₹1,860"]
    answer: 0
    explanation: >
      Amount = 6,000 × 1.10³ = 6,000 × 1.331 = ₹7,986. Compound interest =
      ₹1,986.
    trap: "₹1,800 is the simple interest for the same figures (6,000 × 10% × 3) — over 3 years the compounding gap from simple interest grows noticeably larger than at 2 years."

  - id: compound-interest-007
    difficulty: 0.60
    estimatedSeconds: 65
    question: "A sum invested at compound interest (annual compounding) amounts to ₹13,310 after 3 years at 10% per annum. Find the principal."
    options: ["₹10,000", "₹10,500", "₹9,500", "₹11,000"]
    answer: 0
    explanation: >
      P = 13,310 / 1.10³ = 13,310 / 1.331 = ₹10,000.
    trap: "₹11,000 comes from subtracting a flat 10% three times from 13,310 instead of dividing by 1.10³ — undoing compound growth means dividing by the growth factor, not repeatedly subtracting a percentage."

  - id: compound-interest-008
    difficulty: 0.70
    estimatedSeconds: 80
    question: "Find the difference between the compound interest and the simple interest on ₹25,000 for 3 years at 10% per annum, compounded annually."
    options: ["₹775", "₹750", "₹800", "₹700"]
    answer: 0
    explanation: >
      Simple interest: 25,000 × 10 × 3 / 100 = ₹7,500. Compound: Amount =
      25,000 × 1.10³ = 25,000 × 1.331 = ₹33,275, so CI = ₹8,275. The
      difference is 8,275 − 7,500 = ₹775.
    trap: "₹750 is a rounder, more tempting number, but both the CI and SI figures need to be worked out exactly first — there's no shortcut formula for the 3-year gap the way there is for 2 years."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: compound-interest-012
    difficulty: 0.55
    estimatedSeconds: 75
    source: tnpsc-2015
    year: 2015
    question: "Find the principal that yields a compound interest of ₹1,632 in 2 years at 4% per annum."
    options: ["₹10,000", "₹20,000", "₹30,000", "₹40,000"]
    answer: 1
    explanation: >
      CI = P × (1.04² − 1) = P × 0.0816. Setting this equal to 1,632:
      P = 1,632 / 0.0816 = ₹20,000.
    trap: "₹10,000 halves the correct answer — a sign of mixing up 1.04² − 1 (0.0816) with a simpler but wrong figure like 2 × 0.04 (0.08) along the way."

  - id: compound-interest-013
    difficulty: 0.35
    estimatedSeconds: 50
    source: tnpsc-2015
    year: 2015
    question: "Find the difference between simple and compound interest for a sum of ₹5,000 lent at 12% per annum for 2 years."
    options: ["₹720", "₹12", "₹72", "₹700"]
    answer: 2
    explanation: "For exactly 2 years, the CI-SI gap is P × (R/100)²: 5,000 × 0.12² = 5,000 × 0.0144 = ₹72."
    trap: "₹720 is 10 times too large — a sign of using (R/100) instead of (R/100)² somewhere, since 5,000 × 0.12 = 600 and similar-looking slips land near 720."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: compound-interest-009
    difficulty: 0.55
    estimatedSeconds: 70
    source: tnpsc-2018
    year: 2018
    question: "In how many years will a sum of ₹1,600 amount to ₹1,852.20 at 5% per annum compound interest?"
    options: ["3", "4", "5", "6"]
    answer: 0
    explanation: >
      1,600 × 1.05³ = 1,600 × 1.157625 = ₹1,852.20 exactly, so it takes
      3 years.
    trap: "4 overshoots — check 1,600 × 1.05³ directly rather than assuming a rounder-looking number of years is needed."

  - id: compound-interest-010
    difficulty: 0.50
    estimatedSeconds: 65
    source: tnpsc-2018
    year: 2018
    question: "At what rate of compound interest per annum will ₹640 amount to ₹774.40 in 2 years?"
    options: ["8%", "9%", "10%", "11%"]
    answer: 2
    explanation: >
      774.40 / 640 = 1.21 = 1.1², so the growth factor per year is 1.1,
      meaning the rate is 10%.
    trap: "8% comes from estimating the total growth (21% over 2 years) as roughly double a smaller yearly rate instead of taking the square root of the growth factor."

  - id: compound-interest-011
    difficulty: 0.45
    estimatedSeconds: 60
    source: tnpsc-2018
    year: 2018
    question: "Find the difference between simple interest and compound interest for a sum of ₹8,000 lent at 10% per annum for 2 years."
    options: ["₹70", "₹80", "₹90", "₹100"]
    answer: 1
    explanation: >
      SI = 8,000 × 10 × 2 / 100 = ₹1,600. CI: amount = 8,000 × 1.1² =
      ₹9,680, so CI = ₹1,680. Difference = 1,680 − 1,600 = ₹80. (Matches
      the 2-year shortcut too: 8,000 × (10/100)² = ₹80.)
    trap: "₹100 rounds the growth factor 1.1² to a friendlier number instead of computing 1.21 exactly."

  # A real TNPSC past-year question below, transcribed from a scanned paper
