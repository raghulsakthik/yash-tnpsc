  - id: decimals-015
    difficulty: 0.25
    estimatedSeconds: 35
    question: "Convert 3/8 to a decimal."
    options: ["3.75", "2.6667", "0.475", "0.375"]
    answer: 3
    explanation: "3 ÷ 8 = 0.375."
    trap: "2.6667 inverts the fraction before dividing — always divide numerator by denominator, not the other way round."

