    estimatedSeconds: 35
    question: "What is the remainder when 457 is divided by 8?"
    options: ["1", "3", "0", "2"]
    answer: 0
    explanation: "457 ÷ 8 = 57 with a remainder of 1, since 8 × 57 = 456 and 457 − 456 = 1."
    trap: "Off-by-one remainders are the most common slip — recheck by multiplying the quotient back out."

