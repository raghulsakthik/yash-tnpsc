topic: aptitude.lcm
language: en
source: authored
# Requires division. LCM is also the prerequisite for time-and-work.
questions:
  - id: lcm-001
    difficulty: 0.15
    estimatedSeconds: 25
    question: "What is the LCM of 4 and 6?"
    options: ["12", "24", "8", "6"]
    answer: 0
    explanation: "4 = 2² and 6 = 2 × 3. The LCM takes the highest power of each: 2² × 3 = 12."
    trap: "24 is the PRODUCT of 4 and 6, which is always a common multiple but not always the LEAST one — here they share a factor of 2, so the true LCM is smaller."

  - id: lcm-002
    difficulty: 0.20
    estimatedSeconds: 35
    question: "Find the LCM of 12, 15 and 20."
    options: ["60", "120", "180", "30"]
    answer: 0
    explanation: >
      12 = 2² × 3, 15 = 3 × 5, 20 = 2² × 5. The LCM takes the highest power
      of each prime: 2² × 3 × 5 = 60.
    trap: "30 is a common multiple of 15 and 20 but not of 12 — a true LCM has to be divisible by every number in the list."

  - id: lcm-003
    difficulty: 0.25
    estimatedSeconds: 40
    question: "Two bells toll every 18 seconds and 24 seconds respectively. If both toll together now, after how many seconds will they next toll together?"
    options: ["72 seconds", "48 seconds", "96 seconds", "54 seconds"]
    answer: 0
    explanation: >
      18 = 2 × 3² and 24 = 2³ × 3. The LCM is 2³ × 3² = 72 seconds.
    trap: "48 seconds is a multiple of 24 but check it against 18 — 48 ÷ 18 is not a whole number, so the bells wouldn't actually coincide then."

  - id: lcm-004
    difficulty: 0.30
    estimatedSeconds: 45
    question: "The HCF of two numbers is 6 and their LCM is 72. If one number is 18, find the other."
    options: ["24", "36", "12", "48"]
    answer: 0
    explanation: >
      For any two numbers, HCF × LCM = their product: 6 × 72 = 432. The
      other number is 432 ÷ 18 = 24.
    trap: "36 would make the two numbers equal to each other's double in a way that doesn't satisfy HCF × LCM = product — check: 432 ÷ 18 is 24, not 36."

  - id: lcm-005
    difficulty: 0.35
    estimatedSeconds: 50
    question: "Find the smallest number which, when divided by 8, 12 and 15, leaves no remainder in each case."
    options: ["120", "60", "240", "180"]
    answer: 0
    explanation: >
      This is the LCM of 8, 12 and 15. 8 = 2³, 12 = 2² × 3, 15 = 3 × 5. LCM
      = 2³ × 3 × 5 = 120.
    trap: "60 divides 12 and 15 exactly but not 8 (60 ÷ 8 = 7.5) — it has to divide every number on the list with nothing left over."

  - id: lcm-006
    difficulty: 0.45
    estimatedSeconds: 60
    question: "Find the smallest number which, when divided by 6, 8 and 10, leaves a remainder of 3 in each case."
    options: ["123", "120", "117", "126"]
    answer: 0
    explanation: >
      First find the LCM of 6, 8 and 10: 6 = 2×3, 8 = 2³, 10 = 2×5, LCM =
      2³ × 3 × 5 = 120. The smallest number leaving remainder 3 each time is
      120 + 3 = 123.
    trap: "120 is the LCM itself, which leaves remainder 0, not 3 — the remainder still needs to be added on afterward."

  - id: lcm-007
    difficulty: 0.50
    estimatedSeconds: 65
    question: "Three runners complete a circular track in 12, 16 and 20 minutes respectively. If they start together, after how long will they next meet at the starting point together?"
    options: ["240 minutes", "80 minutes", "160 minutes", "60 minutes"]
    answer: 0
    explanation: >
      12 = 2² × 3, 16 = 2⁴, 20 = 2² × 5. The LCM is 2⁴ × 3 × 5 = 240 minutes.
    trap: "60 minutes is a multiple of 12 and 20 but not of 16 (60 ÷ 16 is not whole) — all three runners have to land on the starting point at once."

  - id: lcm-008
    difficulty: 0.55
    estimatedSeconds: 70
    question: "Find the least number which, when increased by 5, is exactly divisible by 24, 32 and 36."
    options: ["283", "288", "293", "278"]
    answer: 0
    explanation: >
      24 = 2³ × 3, 32 = 2⁵, 36 = 2² × 3². The LCM is 2⁵ × 3² = 288. The
      number itself is 5 less than this: 288 − 5 = 283.
    trap: "288 is the LCM itself — it's already divisible by all three directly, but the question wants the number that becomes divisible only AFTER adding 5, so 5 has to come off the LCM, not be added to it."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: lcm-009
    difficulty: 0.30
    estimatedSeconds: 45
    source: tnpsc-2018
    year: 2018
    question: "The product of two numbers is 1,600 and their HCF is 5. Find the LCM of the numbers."
    options: ["320", "1,605", "1,595", "8,000"]
    answer: 0
    explanation: "For any two numbers, HCF × LCM = their product, so LCM = 1,600 ÷ 5 = 320."
    trap: "8,000 multiplies instead of divides — the relationship is product = HCF × LCM, so finding the LCM means dividing the product by the HCF, not multiplying."
