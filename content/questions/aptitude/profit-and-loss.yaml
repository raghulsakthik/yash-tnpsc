# Cost price vs selling price. Directly examined under Aptitude.
questions:

  - id: profit-and-loss-001
    difficulty: 0.30
    estimatedSeconds: 45
    question: "A shopkeeper buys an article for ₹800 and sells it for ₹920. What is the profit percentage?"
    options: ["17", "15", "13.04", "13"]
    answer: 1
    explanation: "Profit = ₹120. Profit% = (Profit / CP) × 100 = (120/800) × 100 = 15%."
    trap: "Dividing by the selling price instead of the cost price gives a different (and wrong) percentage — profit/loss % is always on the cost price."

