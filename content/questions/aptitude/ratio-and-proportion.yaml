topic: aptitude.ratio-and-proportion
language: en
source: authored
# Requires fractions.
questions:
  - id: ratio-and-proportion-001
    difficulty: 0.15
    estimatedSeconds: 30
    question: "Simplify the ratio 24:36 to its simplest form."
    options: ["2:3", "3:4", "4:6", "1:2"]
    answer: 0
    explanation: "The HCF of 24 and 36 is 12. Dividing both terms: 24:36 = 2:3."
    trap: "4:6 is equal in value to 2:3 but is not yet in its simplest form — the HCF of 24 and 36 is 12, not 6."

  - id: ratio-and-proportion-002
    difficulty: 0.25
    estimatedSeconds: 40
    question: "If a:b = 3:5, what is 2a:3b in its simplest form?"
    options: ["2:5", "6:15", "3:5", "5:3"]
    answer: 0
    explanation: >
      Let a = 3k and b = 5k. Then 2a = 6k and 3b = 15k, giving 6k:15k, which
      simplifies to 2:5.
    trap: "6:15 is the correct value before simplifying — the question asks for the simplest form, and 6 and 15 share a common factor of 3."

  - id: ratio-and-proportion-003
    difficulty: 0.25
    estimatedSeconds: 35
    question: "Divide ₹720 between A and B in the ratio 5:4. What is A's share?"
    options: ["₹400", "₹360", "₹320", "₹450"]
    answer: 0
    explanation: >
      The ratio has 5 + 4 = 9 parts. A's share is 5/9 × 720 = ₹400.
    trap: "₹360 is half of ₹720 — that would be correct for a 1:1 split, but this ratio is 5:4, not equal shares."

  - id: ratio-and-proportion-004
    difficulty: 0.30
    estimatedSeconds: 40
    question: "The ratio of boys to girls in a class is 7:8. If there are 32 girls, how many boys are there?"
    options: ["28", "24", "36", "30"]
    answer: 0
    explanation: >
      8 parts correspond to 32 girls, so 1 part = 4. Boys are 7 parts:
      7 × 4 = 28.
    trap: "36 adds 4 to 32 instead of scaling by the ratio — the difference between the ratio terms (8 and 7) is not the same as the difference in the actual counts."

  - id: ratio-and-proportion-005
    difficulty: 0.35
    estimatedSeconds: 45
    question: "Find the fourth proportional to 4, 6, and 10."
    options: ["15", "12", "20", "24"]
    answer: 0
    explanation: >
      4:6 = 10:x, so x = (6 × 10) / 4 = 15.
    trap: "12 comes from multiplying 4 and 6 and dividing by 2 — the actual rule is cross-multiplying the proportion, not an arbitrary shortcut."

  - id: ratio-and-proportion-006
    difficulty: 0.40
    estimatedSeconds: 50
    question: "Two numbers are in the ratio 3:4. If their sum is 84, find the larger number."
    options: ["48", "36", "42", "44"]
    answer: 0
    explanation: >
      3 + 4 = 7 parts total. Each part is 84 ÷ 7 = 12. The larger number is
      4 × 12 = 48.
    trap: "42 is half of 84 — that's the midpoint, not the larger share of an unequal 3:4 split."

  - id: ratio-and-proportion-007
    difficulty: 0.50
    estimatedSeconds: 65
    question: "If x:y = 2:3 and y:z = 4:5, find x:y:z."
    options: ["8:12:15", "2:3:5", "2:4:5", "6:9:15"]
    answer: 0
    explanation: >
      Scale x:y = 2:3 to 8:12 (×4), and y:z = 4:5 to 12:15 (×3), so both
      share the same value of y, 12. Combined: x:y:z = 8:12:15.
    trap: "6:9:15 scales x:y correctly to 6:9 but doesn't match it to the same y as y:z — the two ratios must be scaled to share a common y before combining."

  - id: ratio-and-proportion-008
    difficulty: 0.60
    estimatedSeconds: 75
    question: "A sum of money is divided among A, B and C in the ratio 2:3:5. If C gets ₹600 more than A, find the total sum."
    options: ["₹2,000", "₹1,800", "₹2,400", "₹1,500"]
    answer: 0
    explanation: >
      Let the parts be 2k, 3k and 5k. C − A = 5k − 2k = 3k = 600, so k = 200.
      The total is (2 + 3 + 5)k = 10 × 200 = ₹2,000.
    trap: "₹1,800 treats the ₹600 difference as spread over all 10 parts instead of just the 3 parts separating A and C."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: ratio-and-proportion-009
    difficulty: 0.60
    estimatedSeconds: 80
    source: tnpsc-2018
    year: 2018
    question: "If (a+b)/c = (b+c)/a = (c+a)/b = k, then the value of k is"
    options: ["0", "1", "2", "a + b + c"]
    answer: 2
    explanation: >
      Adding all three numerators and denominators: the sum of the
      numerators is 2(a+b+c), and the sum of the denominators is
      (a+b+c). A ratio equal to each of several equal ratios is also
      equal to the sum of all the numerators over the sum of all the
      denominators, so k = 2(a+b+c) / (a+b+c) = 2.
    trap: "1 assumes the numerators and denominators sum to the same thing — but adding all three numerators doubles (a+b+c), while the denominators only add up to (a+b+c) once."

  - id: ratio-and-proportion-010
    difficulty: 0.25
    estimatedSeconds: 40
    source: tnpsc-2018
    year: 2018
    question: "The ratio of boys to girls in a class is 4:5. If the number of boys is 20, find the number of girls."
    options: ["15", "20", "25", "26"]
    answer: 2
    explanation: "4 parts = 20 boys, so 1 part = 5. Girls are 5 parts: 5 × 5 = 25."
    trap: "20 repeats the number of boys instead of scaling it up to find the girls' count."

  - id: ratio-and-proportion-011
    difficulty: 0.60
    estimatedSeconds: 85
    source: tnpsc-2018
    year: 2018
    question: "What number should be subtracted from each of the numbers 54, 71, 75 and 99 so that the remainders are proportional (54−x):(71−x) = (75−x):(99−x)?"
    options: ["1", "2", "3", "6"]
    answer: 2
    explanation: >
      Cross-multiplying: (54−x)(99−x) = (71−x)(75−x). Expanding both
      sides: 5,346 − 153x + x² = 5,325 − 146x + x². The x² terms cancel,
      leaving 5,346 − 153x = 5,325 − 146x, so 21 = 7x, giving x = 3.
    trap: "6 is double the correct answer — a sign of an arithmetic slip while expanding the cross-multiplication rather than an error in the method itself."

