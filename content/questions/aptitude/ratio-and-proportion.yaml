  - id: ratio-and-proportion-012
    difficulty: 0.35
    estimatedSeconds: 55
    source: tnpsc-2013
    year: 2013
    question: "The difference between the present ages of P and Q is 8 years, and the ratio of their present ages is 2:3. What is P's present age?"
    options: ["16 yrs", "24 yrs", "12 yrs", "30 yrs"]
    answer: 0
    explanation: >
      Let the ages be 2k and 3k. The difference is 3k − 2k = k = 8. P, the
      smaller share, is 2k = 16 years.
    trap: "24 yrs is Q's age (3k = 24), not P's — double-check which of the two the question is actually asking for."

