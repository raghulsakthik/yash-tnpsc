  - id: simple-interest-012
    difficulty: 0.45
    estimatedSeconds: 65
    source: tnpsc-2024
    year: 2024
    question: "In how many months will a principal of ₹2,000 double itself at 8% per annum simple interest?"
    options: ["144 months", "150 months", "120 months", "140 months"]
    answer: 1
    explanation: >
      Doubling means the interest earned equals the principal (SI = P).
      Time = 100/R years = 100/8 = 12.5 years = 150 months.
    trap: "144 months (12 years) rounds 12.5 down to a tidier whole number of years instead of keeping the exact half-year, which is 6 extra months."

  - id: simple-interest-013
    difficulty: 0.50
    estimatedSeconds: 70
    source: tnpsc-2024
    year: 2024
    question: "Find the simple interest on ₹68,000 at 16 2/3% per annum for 9 months."
    options: ["₹7,500", "₹8,500", "₹6,500", "₹5,500"]
    answer: 1
    explanation: >
      9 months = 0.75 years. 16 2/3% = 1/6 as a fraction. SI = 68,000 ×
      (1/6) × 0.75 = 68,000 × 0.125 = ₹8,500.
    trap: "₹7,500 comes from rounding 16 2/3% down to a plainer-looking 16% before multiplying — keep the exact fraction (1/6) through the calculation."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: simple-interest-014
    difficulty: 0.60
    estimatedSeconds: 85
    source: tnpsc-2016
    year: 2016
    question: "A sum of ₹1,550 was lent partly at 5% and partly at 8% per annum at simple interest. The total interest received after 3 years was ₹300. The ratio of the money lent at 5% to that lent at 8% is"
    options: ["5:8", "8:5", "16:15", "31:6"]
    answer: 2
    explanation: >
      Let ₹x be lent at 5%, so ₹(1,550 − x) is lent at 8%. Over 3 years:
      (x × 5 × 3)/100 + ((1,550 − x) × 8 × 3)/100 = 300. Simplifying:
      15x + 24(1,550 − x) = 30,000, so −9x + 37,200 = 30,000, giving
      x = 800. So ₹800 was lent at 5% and ₹750 at 8%, a ratio of
      800:750 = 16:15.
    trap: "5:8 just copies the two given rates directly as if the money were split in the same ratio as the interest rates — the actual split has to come from solving the total-interest equation, not from the rates themselves."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: simple-interest-015
    difficulty: 0.15
    estimatedSeconds: 30
    source: tnpsc-2022
    year: 2022
    question: "Which among the following is the simple interest for the principal of ₹1,000 for one year at the rate of 10% interest per annum?"
    options: ["₹700", "₹500", "₹150", "₹100"]
    answer: 3
    explanation: "SI = P×R×T/100 = 1,000 × 10 × 1 / 100 = ₹100."
    trap: "₹150 overshoots by guessing a plausible-looking round number instead of applying the SI formula directly to the given principal, rate and time."

  - id: simple-interest-016
    difficulty: 0.55
    estimatedSeconds: 75
    source: tnpsc-2022
    year: 2022
    question: "If the simple interest at the rate of x% per annum, for x years, is ₹x, then the principal amount is"
    options: ["₹x", "₹(100/x)", "₹100x", "₹(100/x²)"]
    answer: 1
    explanation: >
      SI = P × R × T / 100 becomes x = P × x × x / 100, so x = Px²/100.
      Dividing both sides by x: 1 = Px/100, giving P = 100/x.
    trap: "₹(100/x²) divides by an extra factor of x — after x = Px²/100, only ONE factor of x cancels from both sides (x/x² = 1/x), not two."

  - id: simple-interest-017
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2022
    year: 2022
    question: "Kumar borrowed ₹52,000 from a money lender at a particular rate of simple interest. After 4 years, he paid ₹79,040 to settle his debt. At what rate of interest he borrowed the money?"
    options: ["12%", "13%", "15%", "11%"]
    answer: 1
    explanation: >
      SI = 79,040 − 52,000 = ₹27,040. Rate = (SI × 100)/(P × T) =
      (27,040 × 100)/(52,000 × 4) = 2,704,000/208,000 = 13%.
    trap: "12% is close but doesn't check out exactly — recompute 27,040 × 100 and divide by 208,000 precisely rather than rounding to a tidier-looking rate."

  - id: simple-interest-018
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2022
    year: 2022
    question: "At what rate of simple interest, the principle ₹48,000 will amount to ₹55,560 in 2 years 3 months."
    options: ["5%", "6%", "7%", "8%"]
    answer: 2
    explanation: >
      SI = 55,560 − 48,000 = ₹7,560. 2 years 3 months = 2.25 years. Rate
      = (SI × 100)/(P × T) = (7,560 × 100)/(48,000 × 2.25) =
      756,000/108,000 = 7%.
    trap: "6% comes from treating 2 years 3 months as 2.5 years instead of 2.25 years — 3 months is a quarter of a year (0.25), not half (0.5)."
