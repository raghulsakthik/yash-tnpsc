topic: aptitude.simplification
language: en
source: authored
# Requires fractions. Order-of-operations questions, including the "of"
# convention that trips learners up long after BODMAS itself feels solid.
questions:
  - id: simplification-001
    difficulty: 0.20
    estimatedSeconds: 35
    question: "Simplify: 12 + 8 ÷ 4 − 3."
    options: ["11", "9", "17", "5"]
    answer: 0
    explanation: "Division first: 8 ÷ 4 = 2. Then 12 + 2 − 3 = 11."
    trap: "17 comes from doing 12 + 8 = 20 first, then ÷ 4 − 3 — division must apply to the 8 alone, not to the running total."

  - id: simplification-002
    difficulty: 0.25
    estimatedSeconds: 40
    question: "Simplify: 2/3 of 60 − 15."
    options: ["25", "30", "35", "45"]
    answer: 0
    explanation: "2/3 of 60 = 40. Then 40 − 15 = 25."
    trap: "45 subtracts 15 before taking the fraction — 2/3 of (60 − 15) is a different, and wrong, calculation here."

  - id: simplification-003
    difficulty: 0.30
    estimatedSeconds: 45
    question: "Simplify: (15 − 9) × 2 + 6."
    options: ["18", "48", "30", "24"]
    answer: 0
    explanation: "Bracket first: 15 − 9 = 6. Then 6 × 2 = 12, and 12 + 6 = 18."
    trap: "48 comes from computing 6 × (2 + 6) instead — the trailing '+ 6' is a separate term added on afterward, not part of what's being multiplied."

  - id: simplification-004
    difficulty: 0.40
    estimatedSeconds: 55
    question: "Simplify: 1/2 + 1/3 of 3/4."
    options: ["3/4", "5/8", "7/12", "1"]
    answer: 0
    explanation: >
      'Of' acts first, like multiplication: 1/3 × 3/4 = 1/4. Then
      1/2 + 1/4 = 3/4.
    trap: "5/8 comes from adding 1/2 + 1/3 first and then taking 3/4 of that total — but 'of' only multiplies 1/3 by 3/4, it doesn't reach across the whole expression."

  - id: simplification-005
    difficulty: 0.45
    estimatedSeconds: 60
    question: "Simplify: 18 ÷ 3 of 2 + 4."
    options: ["16", "7", "40", "22"]
    answer: 0
    explanation: >
      Division and 'of' (multiplication) are evaluated left to right, same
      as × and ÷: 18 ÷ 3 = 6, then 6 × 2 = 12, then 12 + 4 = 16.
    trap: "7 comes from treating '3 of 2' as a bracket evaluated first — 3 × 2 = 6, then 18 ÷ 6 = 3, plus 4 is 7. Division and 'of' are left-to-right, not grouped."

  - id: simplification-006
    difficulty: 0.50
    estimatedSeconds: 65
    question: "Simplify: 3 − [2 − (5 − 3 ÷ 1)]."
    options: ["3", "1", "5", "0"]
    answer: 0
    explanation: >
      Innermost first: 3 ÷ 1 = 3, so (5 − 3) = 2. Then the square bracket:
      [2 − 2] = 0. Finally 3 − 0 = 3.
    trap: "0 is the value of the inner bracket by itself — it still has to be subtracted from the leading 3, not left as the final answer."

  - id: simplification-007
    difficulty: 0.55
    estimatedSeconds: 65
    question: "Simplify: 2.5 × 4 ÷ 0.5 − 3."
    options: ["17", "13", "7", "20"]
    answer: 0
    explanation: >
      Left to right: 2.5 × 4 = 10, then 10 ÷ 0.5 = 20, then 20 − 3 = 17.
    trap: "20 stops one step early — 2.5 × 4 ÷ 0.5 = 20, but the expression still has a '− 3' left to apply."

  - id: simplification-008
    difficulty: 0.60
    estimatedSeconds: 70
    question: "Solve for x: 3x − 7 = 2x + 8."
    options: ["11", "15", "1", "23"]
    answer: 1
    explanation: >
      Move the x terms to one side: 3x − 2x = 8 + 7, so x = 15.
    trap: "1 comes from subtracting the constants in the wrong direction — moving 7 and 8 to the same side as the x terms changes their signs."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: simplification-009
    difficulty: 0.45
    estimatedSeconds: 60
    source: tnpsc-2018
    year: 2018
    question: "Find the sum of the series 31 + 33 + .... + 53."
    options: ["729", "341", "504", "604"]
    answer: 2
    explanation: >
      This is an arithmetic series: first term 31, common difference 2,
      last term 53. Number of terms = (53 − 31) / 2 + 1 = 12. Sum =
      (number of terms / 2) × (first + last) = 6 × 84 = 504.
    trap: "604 comes from using 13 terms instead of 12 — double-check the term count with (last − first) / difference + 1, not by estimating."

  - id: simplification-010
    difficulty: 0.55
    estimatedSeconds: 75
    source: tnpsc-2018
    year: 2018
    question: "Find the value of (9² × 18⁴) / 3¹⁶."
    options: ["2/3", "4/9", "16/81", "32/243"]
    answer: 2
    explanation: >
      Write everything in prime factors: 9² = 3⁴, and 18⁴ = (2 × 3²)⁴ =
      2⁴ × 3⁸. The numerator is 2⁴ × 3¹². Dividing by 3¹⁶ leaves
      2⁴ / 3⁴ = 16/81.
    trap: "4/9 stops one step early, at 2²/3² instead of 2⁴/3⁴ — recheck that every exponent was carried through fully."

  - id: simplification-011
    difficulty: 0.45
    estimatedSeconds: 55
    source: tnpsc-2018
    year: 2018
    question: "The cube root of 0.027 is"
    options: ["3", "0.003", "0.03", "0.3"]
    answer: 3
    explanation: "0.3 × 0.3 × 0.3 = 0.027, so the cube root of 0.027 is 0.3."
    trap: "0.03 looks like a natural place to put the decimal point, but 0.03³ = 0.000027, not 0.027 — always check by cubing the option back up."

  - id: simplification-012
    difficulty: 0.65
    estimatedSeconds: 90
    source: tnpsc-2018
    year: 2018
    question: "Simplify: (3³)⁻² × (2²)⁻³ all divided by (2⁴)⁻² × 3⁻⁴ × 4⁻²."
    options: ["7 1/9", "7 1/8", "6 2/9", "6 3/8"]
    answer: 0
    explanation: >
      In the numerator: (3³)⁻² = 3⁻⁶, and (2²)⁻³ = 2⁻⁶. In the
      denominator: (2⁴)⁻² = 2⁻⁸, and 4⁻² = (2²)⁻² = 2⁻⁴, so the
      denominator is 2⁻¹² × 3⁻⁴. Dividing: 3⁻⁶⁻⁽⁻⁴⁾ × 2⁻⁶⁻⁽⁻¹²⁾ =
      3⁻² × 2⁶ = 64/9 = 7 1/9.
    trap: "7 1/8 swaps a 9 for an 8 in the final fraction — recheck that the base left over after cancelling is 3, giving ninths, not eighths."

  - id: simplification-013
    difficulty: 0.40
    estimatedSeconds: 55
    source: tnpsc-2018
    year: 2018
    question: "The average of the values 18, 41, x, 36, 31, 24, 37, 35, 27, 36 is 31. Find the value of x."
    options: ["25", "24", "30", "26"]
    answer: 0
    explanation: >
      10 values averaging 31 sum to 310. The 9 known values add to 285,
      so x = 310 − 285 = 25.
    trap: "30 is close to several of the other values in the list and easy to guess — work out the actual sum of the 9 known values rather than estimating."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: simplification-014
    difficulty: 0.40
    estimatedSeconds: 55
    source: tnpsc-2024
    year: 2024
    question: "The sum of the first n natural numbers is 253. Find the value of n."
    options: ["22", "18", "24", "16"]
    answer: 0
    explanation: >
      The sum of the first n natural numbers is n(n+1)/2 = 253, so
      n(n+1) = 506. Since 22 × 23 = 506, n = 22.
    trap: "24 is close to the right answer but 24 × 25 = 600, not 506 — check the product against 506 exactly rather than estimating which n is 'about right'."

  - id: simplification-015
    difficulty: 0.45
    estimatedSeconds: 60
    source: tnpsc-2024
    year: 2024
    question: "Which one of the following lies between the cube root of 7 and the fourth root of 5?"
    options: ["√2", "√3", "√4", "√5"]
    answer: 1
    explanation: >
      Cube root of 7 ≈ 1.91, and the fourth root of 5 ≈ 1.50. Of the
      options, √2 ≈ 1.41 (too small), √3 ≈ 1.73 (fits between 1.50 and
      1.91), √4 = 2 and √5 ≈ 2.24 (both too big).
    trap: "√4 = 2 is close to the cube root of 7 (≈1.91) but actually falls just outside the upper end of the range, not inside it."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: simplification-016
    difficulty: 0.30
    estimatedSeconds: 45
    source: tnpsc-2015
    year: 2015
    question: "The average of 4 values is 20, and when a quantity is added to each value the average becomes 22. Find the quantity."
    options: ["1", "2", "3", "4"]
    answer: 1
    explanation: >
      Original sum: 4 × 20 = 80. Adding x to each of the 4 values adds 4x
      to the total: (80 + 4x)/4 = 20 + x = 22, so x = 2.
    trap: "4 mistakes the number of values for the answer — adding x to every one of 4 values raises the average by exactly x, not by x divided or multiplied by the count."

  - id: simplification-017
    difficulty: 0.45
    estimatedSeconds: 65
    source: tnpsc-2015
    year: 2015
    question: "If x + 1/x = 2, find the value of x³ + 1/x³."
    options: ["1", "2", "3", "4"]
    answer: 1
    explanation: >
      Using the identity (x + 1/x)³ = x³ + 1/x³ + 3(x + 1/x):
      2³ = (x³ + 1/x³) + 3(2), so 8 = (x³ + 1/x³) + 6, giving
      x³ + 1/x³ = 2.
    trap: "1 skips the +3(x+1/x) correction term in the cubing identity entirely, treating (x+1/x)³ as if it equalled x³+1/x³ directly."

  - id: simplification-018
    difficulty: 0.45
    estimatedSeconds: 65
    source: tnpsc-2015
    year: 2015
    question: "A voluntary organization planted a total of 106 trees along the road side. Some of the trees were fruit bearing. If the number of non-fruit bearing trees was two more than thrice the number of fruit bearing trees, how many fruit bearing trees were planted?"
    options: ["20", "22", "24", "26"]
    answer: 3
    explanation: >
      Let fruit-bearing trees be x. Non-fruit-bearing: 3x + 2. Together:
      x + 3x + 2 = 106, so 4x = 104, giving x = 26.
    trap: "24 is close but doesn't satisfy the equation — check that 24 + (3×24+2) = 24 + 74 = 98, not 106; only 26 makes the totals add up exactly."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: simplification-019
    difficulty: 0.40
    estimatedSeconds: 55
    source: tnpsc-2016
    year: 2016
    question: "Mean of 25 observations was found to be 78.4. But later it was found that 96 was mis-read as 69. Then the corrected mean is"
    options: ["79.48", "76.54", "81.32", "78.4"]
    answer: 0
    explanation: >
      The original (wrong) sum was 25 × 78.4 = 1,960. Replacing the
      misread 69 with the true value 96 adds 96 − 69 = 27 to the sum,
      giving 1,987. The corrected mean is 1,987 / 25 = 79.48.
    trap: "81.32 adds the full value 96 to the original sum instead of only the difference (96 − 69 = 27) — the 69 that was wrongly read is already baked into the original mean and must be swapped out, not added on top of."

  - id: simplification-020
    difficulty: 0.45
    estimatedSeconds: 60
    source: tnpsc-2016
    year: 2016
    question: "If x² + 4y² = 4xy, then x:y is"
    options: ["2:1", "1:2", "1:1", "1:4"]
    answer: 0
    explanation: >
      Rearranging: x² − 4xy + 4y² = 0, which is a perfect square,
      (x − 2y)² = 0. So x = 2y, giving x:y = 2:1.
    trap: "1:2 inverts the ratio — solving (x − 2y)² = 0 gives x = 2y (x is the LARGER one), not y = 2x."

  - id: simplification-021
    difficulty: 0.55
    estimatedSeconds: 75
    source: tnpsc-2016
    year: 2016
    question: "If 5ᵃ = 6, 6ᵇ = 7, 7ᶜ = 5, then find the value of abc."
    options: ["0", "−1", "2", "1"]
    answer: 3
    explanation: >
      Writing each as a logarithm: a = log6/log5, b = log7/log6, and
      c = log5/log7. Multiplying all three together, every term cancels
      in a chain (log6, log7 and log5 each appear once on top and once
      on the bottom): abc = (log6/log5) × (log7/log6) × (log5/log7) = 1.
    trap: "0 assumes the chain of fractions collapses to nothing, but each factor genuinely cancels against the NEXT factor in the product, leaving exactly 1 behind, not 0."

  - id: simplification-022
    difficulty: 0.50
    estimatedSeconds: 70
    source: tnpsc-2016
    year: 2016
    question: "The value of ˣ√(ʸ√(ᶻ√a)) is"
    options: ["ˣ√(a^(xz))", "ˣʸ√(a^z)", "ˣʸᶻ√a", "ᶻ√(a^(yz))"]
    answer: 2
    explanation: >
      Each nested root multiplies the overall root index: the z-th root
      of a is a^(1/z), the y-th root of that is a^(1/(yz)), and the x-th
      root of that is a^(1/(xyz)). That's the same as the single xyz-th
      root of a.
    trap: "ˣʸ√(a^z) only combines the outer two root indices (x and y) and leaves z sitting as an exponent instead of folding it into the combined root — all three indices multiply together into one root, not just two of them."
