# Distance = Speed x Time, plus km/h <-> m/s conversion. Directly examined under Aptitude.
questions:

  - id: speed-time-distance-001
    difficulty: 0.25
    estimatedSeconds: 35
    question: "A car travels at 60 km/h for 3 hours. How far does it travel?"
    options: ["180", "63", "177", "240"]
    answer: 0
    explanation: "Distance = Speed × Time = 60 × 3 = 180 km."
    trap: "Adding speed and time instead of multiplying them is a simple but common slip under time pressure."

