  - id: speed-time-distance-015
    difficulty: 0.40
    estimatedSeconds: 55
    question: "Two towns are 240 km apart. A train leaves each town at the same time, travelling towards each other at 60 km/h and 40 km/h. After how many hours do they meet?"
    options: ["1.4", "2.4", "3.4", "12"]
    answer: 1
    explanation: "Travelling towards each other, their speeds add: combined speed = 60 + 40 = 100 km/h. Time to meet = distance ÷ combined speed = 240 ÷ 100 = 2.4 hours."
    trap: "Subtracting the speeds instead of adding them is the formula for one train catching up to another moving the same direction, not two moving towards each other."

