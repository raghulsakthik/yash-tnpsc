topic: aptitude.time-and-work
language: en
source: authored
# Requires fractions and lcm.
questions:
  - id: time-and-work-001
    difficulty: 0.20
    estimatedSeconds: 35
    question: "A can do a piece of work in 12 days. What fraction of the work does A complete in 4 days?"
    options: ["1/3", "1/4", "1/2", "2/3"]
    answer: 0
    explanation: "A's rate is 1/12 of the work per day. In 4 days: 4 × 1/12 = 4/12 = 1/3."
    trap: "1/4 swaps the numbers — it treats 12 days as the amount of work done in 4 units, the wrong way round."

  - id: time-and-work-002
    difficulty: 0.25
    estimatedSeconds: 40
    question: "A can finish a job in 10 days and B can finish it in 15 days. In how many days can they finish it together?"
    options: ["6 days", "8 days", "5 days", "12 days"]
    answer: 0
    explanation: >
      Combined rate: 1/10 + 1/15 = 3/30 + 2/30 = 5/30 = 1/6 of the work per
      day, so together they take 6 days.
    trap: "12.5 days (close to option 12) comes from averaging the two times — rates add, not times; working together is always faster than either alone, which rules out anything above 10 days immediately."

  - id: time-and-work-003
    difficulty: 0.35
    estimatedSeconds: 55
    question: "A and B together can complete a work in 12 days, and A alone can complete it in 20 days. In how many days can B alone complete it?"
    options: ["30 days", "24 days", "36 days", "40 days"]
    answer: 0
    explanation: >
      Combined rate 1/12, A's rate 1/20. B's rate = 1/12 − 1/20 =
      5/60 − 3/60 = 2/60 = 1/30, so B alone takes 30 days.
    trap: "24 days comes from a subtraction slip in the fractions — 1/12 − 1/20 needs a common denominator of 60, not 20 or 12 alone."

  - id: time-and-work-004
    difficulty: 0.40
    estimatedSeconds: 55
    question: "A, B and C can each complete a work alone in 10, 15 and 30 days respectively. In how many days can they complete it working together?"
    options: ["5 days", "6 days", "8 days", "10 days"]
    answer: 0
    explanation: >
      Combined rate: 1/10 + 1/15 + 1/30 = 3/30 + 2/30 + 1/30 = 6/30 = 1/5,
      so together they take 5 days.
    trap: "10 days is C's time alone — adding a third, slower worker can only ever speed things up from the two-worker time, never match the slowest worker's own time."

  - id: time-and-work-005
    difficulty: 0.30
    estimatedSeconds: 45
    question: "A can do a work in 18 days, and B is 50% more efficient than A. In how many days can B alone complete the work?"
    options: ["12 days", "9 days", "15 days", "27 days"]
    answer: 0
    explanation: >
      Being 50% more efficient means B's RATE is 1.5 times A's rate:
      1.5 × 1/18 = 1/12, so B takes 12 days.
    trap: "27 days adds 50% to A's TIME instead of A's rate — being more efficient means taking LESS time, not more, so an answer bigger than 18 can't be right."

  - id: time-and-work-006
    difficulty: 0.50
    estimatedSeconds: 70
    question: "A does a work in 20 days. After working alone for 5 days, he is joined by B, and together they finish the remaining work in 6 days. In how many days can B alone do the work?"
    options: ["13 1/3 days", "15 days", "12 days", "16 days"]
    answer: 0
    explanation: >
      In 5 days A completes 5/20 = 1/4 of the work, leaving 3/4. Together,
      A and B finish 3/4 in 6 days, so their combined rate is
      (3/4) ÷ 6 = 1/8. B's rate is 1/8 − 1/20 = 5/40 − 2/40 = 3/40, so B
      alone takes 40/3 = 13 1/3 days.
    trap: "15 days rounds the fraction 40/3 to a tidier-looking number instead of keeping it exact — 40/3 is 13 1/3, not 15."

  - id: time-and-work-007
    difficulty: 0.60
    estimatedSeconds: 75
    question: "A and B together can do a work in 8 days. They worked together for 3 days, after which A left, and B alone finished the remaining work in 15 more days. In how many days can A alone do the whole work?"
    options: ["12 days", "10 days", "15 days", "18 days"]
    answer: 0
    explanation: >
      In 3 days together they complete 3/8 of the work, leaving 5/8. B
      finishes 5/8 in 15 days, so B's rate is (5/8) ÷ 15 = 1/24. A's rate =
      1/8 − 1/24 = 3/24 − 1/24 = 2/24 = 1/12, so A alone takes 12 days.
    trap: "18 days comes from subtracting the days (15 − 3 and similar) instead of working with rates — time-and-work problems need rates to be added or subtracted, never the raw day counts."

  - id: time-and-work-008
    difficulty: 0.55
    estimatedSeconds: 60
    question: "12 men can complete a piece of work in 18 days. How many men are needed to complete the same work in 8 days?"
    options: ["27 men", "24 men", "30 men", "20 men"]
    answer: 0
    explanation: >
      The total work is 12 × 18 = 216 man-days. For 8 days: 216 ÷ 8 = 27
      men.
    trap: "24 men comes from scaling 12 by the ratio of 18:8 rounded to roughly 2 (12 × 2) instead of computing the exact man-days — 18/8 is not a clean multiple, so the full division has to be done."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: time-and-work-009
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2018
    year: 2018
    question: "Six men working 10 hours a day can do a piece of work in 24 days. In how many days will 9 men working 8 hours a day do the same work?"
    options: ["10 days", "15 days", "20 days", "25 days"]
    answer: 2
    explanation: >
      Total effort is constant: 6 men × 10 hours × 24 days = 1,440
      man-hours. For 9 men working 8 hours a day: 1,440 ÷ (9 × 8) =
      1,440 ÷ 72 = 20 days.
    trap: "10 days comes from assuming more men AND more hours per day both speed things up by a full factor each, double-counting the speed-up instead of dividing the total man-hours once."

  - id: time-and-work-010
    difficulty: 0.50
    estimatedSeconds: 70
    source: tnpsc-2018
    year: 2018
    question: "A can finish a job in 20 days and B can complete it in 30 days. They work together and finish the job. If ₹600 is paid as wages, what is the share of A and B?"
    options: ["₹240, ₹360", "₹300, ₹300", "₹360, ₹240", "₹400, ₹200"]
    answer: 2
    explanation: >
      Wages split in the ratio of work done, which is the ratio of their
      rates: (1/20) : (1/30) = 3 : 2 (multiplying both by 60). Splitting
      ₹600 in a 3:2 ratio gives A ₹360 and B ₹240.
    trap: "₹300, ₹300 splits the money evenly, ignoring that A works faster than B and so did more of the job — an equal split only makes sense if both took the same number of days."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: time-and-work-011
    difficulty: 0.60
    estimatedSeconds: 85
    source: tnpsc-2013
    year: 2013
    question: "A and B can do a piece of work in 10 days; B and C in 15 days; C and A in 18 days. In how many days can B alone do it?"
    options: ["30 days", "20 days", "12 days", "18 days"]
    answer: 3
    explanation: >
      (A+B) + (B+C) + (C+A) = 2(A+B+C) = 1/10 + 1/15 + 1/18. Over a common
      denominator of 90: 9/90 + 6/90 + 5/90 = 20/90 = 2/9, so
      A+B+C = 1/9. B alone is (A+B+C) − (C+A) = 1/9 − 1/18 = 1/18, so B
      takes 18 days.
    trap: "12 days comes from averaging the three given times in some way rather than combining their rates — time-and-work problems with pairs like this need the sum-of-all-three-rates trick, not an average."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: time-and-work-012
    difficulty: 0.35
    estimatedSeconds: 50
    source: tnpsc-2024
    year: 2024
    question: "A can finish a job in 6 days, whereas B finishes it in 12 days. How long does it take them to complete the job working together?"
    options: ["6 days", "4 days", "8 days", "3 days"]
    answer: 1
    explanation: >
      Combined rate: 1/6 + 1/12 = 2/12 + 1/12 = 3/12 = 1/4, so together
      they take 4 days.
    trap: "6 days repeats A's own time, as if working with a slower partner made no difference at all — working together is always faster than either person alone."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: time-and-work-013
    difficulty: 0.35
    estimatedSeconds: 50
    source: tnpsc-2015
    year: 2015
    question: "7 men can complete a work in 52 days. In how many days will 13 men finish the same work?"
    options: ["20 days", "13 days", "7 days", "28 days"]
    answer: 3
    explanation: "Total effort: 7 × 52 = 364 man-days. For 13 men: 364 ÷ 13 = 28 days."
    trap: "13 days mistakes the number of men for the answer itself — the question asks how many days 13 men take, not for the number 13 restated."

  - id: time-and-work-014
    difficulty: 0.55
    estimatedSeconds: 75
    source: tnpsc-2015
    year: 2015
    question: "If 12 compositors can compose 60 pages of a book in 5 hours, how many compositors will compose 200 pages of the book in 20 hours?"
    options: ["8", "10", "12", "11"]
    answer: 1
    explanation: >
      Using (men × hours)/pages held proportional: 12 × 5 × 200 = M × 20
      × 60, so 12,000 = 1,200 × M, giving M = 10.
    trap: "12 keeps the original number of compositors, missing that 20 hours (4× longer) comfortably covers the extra pages (200 is only a bit more than 3× the original 60), so fewer people are actually needed."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: time-and-work-015
    difficulty: 0.35
    estimatedSeconds: 50
    source: tnpsc-2016
    year: 2016
    question: "First pipe can fill a tank in 12 hours. Second pipe can fill the same tank in 6 hours. Third pipe in 4 hours. How long will it take to fill the tank if all the 3 pipes are opened simultaneously?"
    options: ["2 hrs.", "3 hrs.", "4 hrs.", "12 hrs."]
    answer: 0
    explanation: >
      Combined rate: 1/12 + 1/6 + 1/4 = 1/12 + 2/12 + 3/12 = 6/12 = 1/2
      tank per hour. Time to fill = 1 ÷ (1/2) = 2 hours.
    trap: "4 hrs. is the time for the slowest pipe's partner combination mis-added — adding the three fill TIMES instead of their RATES gives a nonsense figure; rates (reciprocals of time) are what combine by simple addition, not the times themselves."

  - id: time-and-work-016
    difficulty: 0.45
    estimatedSeconds: 65
    source: tnpsc-2016
    year: 2016
    question: "Seven men working 9 hours a day can do a piece of work in 30 days. In how many days will 10 men working for 7 hours a day do the same work?"
    options: ["28 days", "30 days", "32 days", "27 days"]
    answer: 3
    explanation: >
      Total effort stays constant: 7 × 9 × 30 = 1,890 man-hours. With 10
      men working 7 hours a day, days = 1,890 / (10 × 7) = 1,890 / 70 =
      27 days.
    trap: "32 days assumes fewer total man-hours get the job done more slowly — but 10 men is MORE workers than 7, so even with fewer hours per day the job actually finishes sooner, not later."

  - id: time-and-work-017
    difficulty: 0.40
    estimatedSeconds: 60
    source: tnpsc-2016
    year: 2016
    question: "A can do a certain job in 12 days. B is 60% more efficient than A. How many days does B alone take to do the same job?"
    options: ["6 days", "7½ days", "8 days", "8½ days"]
    answer: 1
    explanation: >
      B's efficiency is 1.6 times A's, so B takes 1/1.6 of A's time:
      12 / 1.6 = 7.5 = 7½ days.
    trap: "8 days treats the 60% as if it reduced the TIME directly (12 × 0.6 subtracted in a rougher way) rather than scaling the efficiency — a 60% efficiency boost means dividing the time by 1.6, not subtracting 60% of the days."
