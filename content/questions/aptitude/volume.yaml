topic: aptitude.volume
language: en
source: authored
# Requires area.
questions:
  - id: volume-001
    difficulty: 0.20
    estimatedSeconds: 35
    question: "Find the volume of a cube with side 5 cm."
    options: ["25 cm³", "125 cm³", "75 cm³", "15 cm³"]
    answer: 1
    explanation: "Volume of a cube is side × side × side: 5 × 5 × 5 = 125 cm³."
    trap: "25 cm³ squares the side instead of cubing it — that's the area of one face, not the volume of the whole cube."

  - id: volume-002
    difficulty: 0.25
    estimatedSeconds: 40
    question: "Find the volume of a cuboid with length 8 cm, breadth 5 cm and height 3 cm."
    options: ["80 cm³", "96 cm³", "120 cm³", "40 cm³"]
    answer: 2
    explanation: "Volume of a cuboid is length × breadth × height: 8 × 5 × 3 = 120 cm³."
    trap: "40 cm³ is only length × breadth, the area of the base — the height still has to be multiplied in to get a volume."

  - id: volume-003
    difficulty: 0.40
    estimatedSeconds: 60
    question: "A cylindrical tank has radius 7 m and height 10 m. Find its volume. (Use π = 22/7.)"
    options: ["154 m³", "3,080 m³", "1,540 m³", "770 m³"]
    answer: 2
    explanation: >
      Volume of a cylinder is πr²h: 22/7 × 7 × 7 × 10 = 22 × 7 × 10 =
      1,540 m³.
    trap: "154 m³ is just the base area, πr² — the height still needs to be multiplied in to turn an area into a volume."

  - id: volume-004
    difficulty: 0.30
    estimatedSeconds: 45
    question: "Find the volume of a cube whose edge is 0.5 m."
    options: ["1.5 m³", "0.75 m³", "0.25 m³", "0.125 m³"]
    answer: 3
    explanation: "0.5 × 0.5 × 0.5 = 0.125 m³."
    trap: "0.25 m³ comes from 0.5 × 0.5 — squaring instead of cubing, the same slip as treating a volume formula like an area formula."

  - id: volume-005
    difficulty: 0.45
    estimatedSeconds: 60
    question: "A cuboid has volume 360 cm³. If its length is 10 cm and breadth is 6 cm, find its height."
    options: ["4 cm", "6 cm", "8 cm", "12 cm"]
    answer: 1
    explanation: "Height = volume ÷ (length × breadth) = 360 ÷ (10 × 6) = 360 ÷ 60 = 6 cm."
    trap: "4 cm comes from dividing by length and breadth added together (16) instead of multiplied (60)."

  - id: volume-006
    difficulty: 0.55
    estimatedSeconds: 70
    question: "How many cubes of edge 2 cm can be cut from a cube of edge 8 cm?"
    options: ["16", "32", "64", "128"]
    answer: 2
    explanation: >
      The edge ratio is 8 ÷ 2 = 4. Volume scales with the CUBE of that
      ratio, so the number of small cubes is 4³ = 64. (Check by volumes:
      8³ ÷ 2³ = 512 ÷ 8 = 64.)
    trap: "16 uses the edge ratio (4) doubled instead of cubed — the count of small cubes grows with the cube of the ratio, not a simple multiple of it."

  - id: volume-007
    difficulty: 0.50
    estimatedSeconds: 60
    question: "A rectangular water tank is 5 m long, 4 m wide and 3 m deep. How many litres of water can it hold? (1 m³ = 1,000 litres)"
    options: ["60,000 litres", "6,000 litres", "12,000 litres", "600 litres"]
    answer: 0
    explanation: "Volume = 5 × 4 × 3 = 60 m³. In litres: 60 × 1,000 = 60,000 litres."
    trap: "6,000 litres forgets a zero in the 1 m³ = 1,000 litres conversion."

  - id: volume-008
    difficulty: 0.60
    estimatedSeconds: 75
    question: "The volume of a cylinder is 4,620 cm³ and its height is 30 cm. Find its radius. (Use π = 22/7.)"
    options: ["4 cm", "5 cm", "7 cm", "10 cm"]
    answer: 2
    explanation: >
      r² = volume ÷ (π × h) = 4,620 ÷ (22/7 × 30) = 4,620 ÷ (660/7) =
      4,620 × 7 ÷ 660 = 49. So r = √49 = 7 cm.
    trap: "10 cm comes from skipping the square root at the end and working with a rounded intermediate value instead."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: volume-009
    difficulty: 0.55
    estimatedSeconds: 75
    source: tnpsc-2018
    year: 2018
    question: "The surface areas of two spheres are in the ratio 9 : 25. Find the ratio of their volumes."
    options: ["27 : 75", "27 : 125", "81 : 625", "729 : 15625"]
    answer: 1
    explanation: >
      Surface area scales with r², so the radius ratio is √9 : √25 = 3 : 5.
      Volume scales with r³, so the volume ratio is 3³ : 5³ = 27 : 125.
    trap: "81 : 625 squares the radius ratio (3²:5²) again instead of cubing it — surface area already used up one power of r² to get the radius ratio; volume needs the radius ratio cubed, not squared a second time."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: volume-010
    difficulty: 0.60
    estimatedSeconds: 85
    source: tnpsc-2024
    year: 2024
    question: "A swimming bath is 24 m long and 15 m wide. When a number of men dive in, the water level rises by 1 cm. If each man displaces an average of 0.1 m³ of water, how many men are in the bath?"
    options: ["32", "36", "42", "46"]
    answer: 1
    explanation: >
      Volume of water displaced = length × width × rise = 24 × 15 × 0.01
      = 3.6 m³. Number of men = 3.6 ÷ 0.1 = 36.
    trap: "32 comes from a small slip in the rise conversion — double-check that 1 cm becomes 0.01 m, not 0.1 m, before multiplying."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: volume-011
    difficulty: 0.65
    estimatedSeconds: 95
    source: tnpsc-2015
    year: 2015
    question: "A hollow cylindrical iron pipe is 35 cm long. Its outer and inner diameters are 10 cm and 8 cm respectively. Find the weight of the pipe if 1 cu.cm of iron weighs 7 g."
    options: ["6.93 kg", "9.90 kg", "7.53 kg", "7.93 kg"]
    answer: 0
    explanation: >
      Outer radius 5 cm, inner radius 4 cm. Volume of iron = π(R² − r²) ×
      length = (22/7) × (25 − 16) × 35 = (22/7) × 9 × 35 = 22 × 9 × 5 =
      990 cm³. Weight = 990 × 7 g = 6,930 g = 6.93 kg.
    trap: "9.90 kg uses the outer radius alone (π × 25 × 35-style volume) without subtracting the hollow inner cylinder — a pipe's cross-section is a ring, not a full circle."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: volume-012
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2016
    year: 2016
    question: "A cone, a hemisphere and a cylinder stand on equal bases and have the same height. Find the ratio of their volumes."
    options: ["3:2:1", "1:2:3", "3:1:2", "1:3:2"]
    answer: 1
    explanation: >
      A hemisphere's height always equals its own radius, so for the
      cone and cylinder to share that same height, h = r for all three.
      Cone = (1/3)πr²h = (1/3)πr³. Hemisphere = (2/3)πr³. Cylinder =
      πr²h = πr³. The ratio (1/3):(2/3):1 simplifies to 1:2:3.
    trap: "3:2:1 reverses the ratio entirely — the cone (the 'pointiest', most hollowed-out shape) holds the LEAST volume of the three, not the most, so it belongs at the small end of the ratio, not the large end."
