    question: "Which Constitutional Amendment added the words 'Socialist' and 'Secular' to the Preamble?"
    options: ["42nd Amendment (1976)", "44th Amendment (1978)", "1st Amendment (1951)", "61st Amendment (1989)"]
    answer: 0
    explanation: "The 42nd Amendment Act, 1976, inserted 'Socialist', 'Secular' and 'Integrity' into the Preamble."
    trap: "The 44th Amendment is often confused with the 42nd since both date from the same turbulent period, but it reversed some 42nd Amendment changes rather than adding these words."

