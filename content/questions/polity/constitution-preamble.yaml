    question: "The Preamble to the Indian Constitution declares India to be a sovereign, socialist, secular, democratic what?"
    options: ["Republic", "Union of States", "Federation", "Commonwealth"]
    answer: 0
    explanation: "The Preamble's exact phrase is 'Sovereign Socialist Secular Democratic Republic'."
    trap: "'Union of States' is Article 1's description of India, not the Preamble's own phrase — the two are often mixed up."
