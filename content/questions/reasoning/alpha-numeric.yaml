  - id: alpha-numeric-014
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2015
    year: 2015
    question: "Find the missing term in the series: AZ, GT, MN, ?, YB."
    options: ["JH", "SH", "SK", "TS"]
    answer: 1
    explanation: >
      First letters: A(1), G(7), M(13) — each +6, so the next is 19 = S,
      and Y(25) confirms the pattern (19+6=25). Second letters: Z(26),
      T(20), N(14) — each −6, so the next is 8 = H, and B(2) confirms it
      (8−6=2). The missing term is SH.
    trap: "TS swaps the order of the two letters — the first letter of each pair climbs the alphabet while the second one descends, so matching which letter goes first matters."

  - id: alpha-numeric-015
    difficulty: 0.55
    estimatedSeconds: 75
    source: tnpsc-2015
    year: 2015
    question: "If ORIENT is written as 532146 and SOUL is written as 7598, how will you write LINE?"
    options: ["9241", "8341", "8241", "6241"]
    answer: 2
    explanation: >
      Matching letters to digits across both words: O=5, R=3, I=2, E=1,
      N=4, T=6 (from ORIENT), and S=7, O=5, U=9, L=8 (from SOUL — note O=5
      agrees with the first word, confirming the code is consistent).
      LINE: L=8, I=2, N=4, E=1, giving 8241.
    trap: "9241 mismatches the first digit — L is coded as 8 (from SOUL), not 9, which belongs to U."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: alpha-numeric-016
    difficulty: 0.35
    estimatedSeconds: 50
    source: tnpsc-2016
    year: 2016
    question: "Find the next alphabet in the sequence: B, E, I, N, ?"
    options: ["U", "V", "T", "S"]
    answer: 2
    explanation: >
      The gaps between letters grow by one each time: B(2) to E(5) is
      +3, E to I(9) is +4, I to N(14) is +5. The next gap is +6:
      14 + 6 = 20, which is T.
    trap: "U is one letter past the correct answer — it comes from a gap of +7 instead of continuing the established pattern of the gap growing by exactly one each step (+6 here, not +7)."

  # A real TNPSC past-year question below, transcribed from a scanned paper
