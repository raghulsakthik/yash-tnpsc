topic: reasoning.alpha-numeric
language: en
source: authored
# No prerequisite edges. Alphabet positions (A=1 ... Z=26) are fixed, well-
# defined facts, which keeps every question here unambiguous.
questions:
  - id: alpha-numeric-001
    difficulty: 0.15
    estimatedSeconds: 25
    question: "If A=1, B=2, C=3, ... Z=26, what number represents the letter J?"
    options: ["9", "10", "11", "8"]
    answer: 1
    explanation: "J is the 10th letter of the alphabet."
    trap: "9 is I's position, one letter short of J — easy to be off by one when counting quickly."

  - id: alpha-numeric-002
    difficulty: 0.20
    estimatedSeconds: 30
    question: "What letter is 5 positions after E in the alphabet?"
    options: ["I", "J", "K", "H"]
    answer: 1
    explanation: "E is the 5th letter. 5 + 5 = 10, which is J."
    trap: "I is only 4 positions after E — counting E itself as the '+1' step is a common off-by-one mistake."

  - id: alpha-numeric-003
    difficulty: 0.30
    estimatedSeconds: 45
    question: "In a code, CAT is written as DBU. How is DOG written in the same code?"
    options: ["EPG", "EPH", "CNF", "DPH"]
    answer: 1
    explanation: >
      Each letter shifts forward by 1: C→D, A→B, T→U. Applying the same
      shift to DOG: D→E, O→P, G→H, giving EPH.
    trap: "CNF shifts every letter BACKWARD by one instead of forward — always confirm the direction of the shift against the given example first."

  - id: alpha-numeric-004
    difficulty: 0.30
    estimatedSeconds: 35
    question: "Find the missing letter in the series: B, D, F, H, ?, L"
    options: ["I", "J", "K", "M"]
    answer: 1
    explanation: "The series skips one letter each time (+2): B, D, F, H, J, L."
    trap: "I is the very next letter after H, but this series skips a letter each step — the next term in the pattern is J, not I."

  - id: alpha-numeric-005
    difficulty: 0.35
    estimatedSeconds: 45
    question: "Find the next term in the series: A1, C3, E5, G7, ?"
    options: ["H8", "I9", "H9", "I8"]
    answer: 1
    explanation: >
      The letters skip one each time (A, C, E, G, I...) and the numbers
      are the odd numbers in order (1, 3, 5, 7, 9). The next term is I9.
    trap: "H8 continues both parts by a plain +1 instead of following the established skip-one-letter, odd-number pattern already set by the series."

  - id: alpha-numeric-006
    difficulty: 0.40
    estimatedSeconds: 50
    question: "If 'FLOWER' is coded as 'GMPXFS' (each letter shifted forward by one), how would 'PLANT' be coded the same way?"
    options: ["QMBOU", "OKZMS", "QMBOT", "PMBOU"]
    answer: 0
    explanation: "Shifting each letter of PLANT forward by one: P→Q, L→M, A→B, N→O, T→U, giving QMBOU."
    trap: "OKZMS shifts every letter BACKWARD instead of forward — check the direction against the FLOWER→GMPXFS example before applying it."

  - id: alpha-numeric-007
    difficulty: 0.45
    estimatedSeconds: 45
    question: "If Z=1, Y=2, X=3, ... A=26 (the alphabet numbered in reverse), what number represents the letter D?"
    options: ["4", "22", "23", "24"]
    answer: 2
    explanation: >
      D's normal position is 4. In reverse numbering, its value is
      27 − 4 = 23.
    trap: "4 uses D's normal forward position and forgets the question has reversed the numbering entirely."

  - id: alpha-numeric-008
    difficulty: 0.50
    estimatedSeconds: 50
    question: "Find the missing term in the series: Z, X, V, T, ?, P"
    options: ["S", "R", "Q", "U"]
    answer: 1
    explanation: >
      The series steps backward by 2 each time: Z(26), X(24), V(22),
      T(20), R(18), P(16). The missing term is R.
    trap: "S is one step short of the full −2 jump from T — moving by 2 positions, not 1, is what this series requires at every step."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: alpha-numeric-009
    difficulty: 0.50
    estimatedSeconds: 65
    source: tnpsc-2018
    year: 2018
    question: "Complete the series: 1 ZA, 3 YB, 6 XC, 10 WD, ?"
    options: ["14 VE", "15 UE", "12 VE", "15 VE"]
    answer: 3
    explanation: >
      The numbers are triangular numbers (1, 3, 6, 10, 15 — each gap
      grows by one: +2, +3, +4, +5). The first letters step backward
      through the alphabet (Z, Y, X, W, → V), and the second letters step
      forward (A, B, C, D, → E). Putting it together: 15 VE.
    trap: "15 UE gets the number right but slips on the first letter — stepping from W to V, not U, continues the backward sequence by exactly one place."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: alpha-numeric-010
    difficulty: 0.50
    estimatedSeconds: 70
    source: tnpsc-2013
    year: 2013
    question: "In a certain code, LABOUR is written as KBAPTS. How is CANDID written in that code?"
    options: ["DBOEJE", "BBMCHC", "DZOCJC", "BBMEHE"]
    answer: 3
    explanation: >
      Comparing LABOUR to KBAPTS letter by letter, the shift alternates:
      L→K (−1), A→B (+1), B→A (−1), O→P (+1), U→T (−1), R→S (+1).
      Applying the same alternating −1/+1 pattern to CANDID: C→B (−1),
      A→B (+1), N→M (−1), D→E (+1), I→H (−1), D→E (+1), giving BBMEHE.
    trap: "DZOCJC starts the alternation on the wrong foot — shifting the very first letter +1 instead of −1 and alternating from there — so every letter ends up shifted the opposite way from the real pattern."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: alpha-numeric-011
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2024
    year: 2024
    question: "If fox = cat, then xerox may be equal to:"
    options: ["terct", "tcroa", "tcrot", "terat"]
    answer: 3
    explanation: >
      Matching fox to cat letter by letter gives a substitution table:
      f→c, o→a, x→t. Letters with no entry in the table (like e and r)
      stay unchanged. Applying this to xerox: x→t, e→e, r→r, o→a, x→t,
      giving terat.
    trap: "tcrot keeps the 4th letter as 'o' instead of translating it — every occurrence of a mapped letter has to be converted, not just the first one."

  - id: alpha-numeric-012
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2024
    year: 2024
    question: "If cat = abc and dog = def, then which one of the following may be equal to tan/cot?"
    options: ["cba/aec", "cba/ace", "cbn/ace", "cbn/aec"]
    answer: 3
    explanation: >
      Matching cat↔abc and dog↔def letter by letter gives: c→a, a→b,
      t→c, d→d, o→e, g→f. Letters with no entry (like n) stay unchanged.
      Applying this: tan → t(c) a(b) n(n) = cbn. cot → c(a) o(e) t(c) =
      aec. So tan/cot → cbn/aec.
    trap: "cbn/ace gets the numerator right but mixes up the order of the denominator's letters — cot translates letter-by-letter to a, e, c in that order, not a, c, e."

  - id: alpha-numeric-013
    difficulty: 0.60
    estimatedSeconds: 90
    source: tnpsc-2024
    year: 2024
    question: "E&GBDM4NKH2ACZSV3F1JLOQ5PR: what will come in place of the question mark in the following sequence? GDR, BMP, D45, ?"
    options: ["MNQ", "4NQ", "MKO", "M4Q"]
    answer: 0
    explanation: >
      Numbering the 26 characters of the string 1 to 26, each group of
      three pulls from positions (g+2, g+4, 27−g) where g is the group
      number: group 1 (3,5,26)=G,D,R; group 2 (4,6,25)=B,M,P; group 3
      (5,7,24)=D,4,5 — all confirmed. Group 4 is (6,8,23), which are
      M, N and Q.
    trap: "4NQ keeps the group-3 first letter's '4' in place of recomputing it — each group's first position shifts by one along the string too, not just the last position."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
