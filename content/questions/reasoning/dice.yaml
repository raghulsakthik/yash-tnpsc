topic: reasoning.dice
language: en
source: authored
# No prerequisite edges. Every question here uses one explicitly-stated,
# unambiguous rule — a standard die's opposite faces sum to 7 — rather than
# multi-throw rotation puzzles, which are easy to get subtly wrong without
# a physical model to check against.
questions:
  - id: dice-001
    difficulty: 0.15
    estimatedSeconds: 30
    question: "On a standard die, numbers on opposite faces add up to 7. If 5 is on the top face, what number is on the bottom face?"
    options: ["1", "2", "3", "4"]
    answer: 1
    explanation: "Opposite faces sum to 7, so the bottom face is 7 − 5 = 2."
    trap: "3 would be the answer if 4 were on top instead — it's easy to subtract from the wrong number under time pressure."

  - id: dice-002
    difficulty: 0.15
    estimatedSeconds: 30
    question: "On a standard die, opposite faces add up to 7. Which number is opposite to 1?"
    options: ["5", "6", "7", "4"]
    answer: 1
    explanation: "7 − 1 = 6."
    trap: "7 mistakes the SUM of the pair for the other NUMBER in the pair."

  - id: dice-003
    difficulty: 0.20
    estimatedSeconds: 40
    question: "On a standard die, opposite faces add up to 7. What is the sum of the four side faces (excluding top and bottom) when 3 is facing up?"
    options: ["12", "14", "17", "21"]
    answer: 1
    explanation: >
      All six faces (1 to 6) sum to 21. The top and bottom always sum to 7
      (that's the opposite-faces rule), so the remaining four side faces
      sum to 21 − 7 = 14 — and this is true no matter which number is on
      top, since top + bottom is always 7.
    trap: "21 is the total of all six faces, including the top and bottom the question says to exclude."

  - id: dice-004
    difficulty: 0.20
    estimatedSeconds: 30
    question: "A die (opposite faces sum to 7) is placed on a table showing 6 on top. What number is on the face touching the table?"
    options: ["1", "2", "5", "6"]
    answer: 0
    explanation: "The face touching the table is the bottom face, opposite the top: 7 − 6 = 1."
    trap: "6 repeats the top face instead of finding its opposite — the touching face is always the bottom, never the same as the top."

  - id: dice-005
    difficulty: 0.30
    estimatedSeconds: 40
    question: "Two standard dice are thrown together. The sum of the two top faces is 9, and one die shows 4. What does the other die show?"
    options: ["4", "5", "6", "3"]
    answer: 1
    explanation: "9 − 4 = 5."
    trap: "4 assumes both dice match, but the question only says their SUM is 9, not that they're equal."

  - id: dice-006
    difficulty: 0.35
    estimatedSeconds: 45
    question: "A standard die (opposite faces sum to 7) shows 2 on top and 3 facing you (the front face). What number is on the bottom face?"
    options: ["4", "5", "6", "3"]
    answer: 1
    explanation: >
      The bottom face only depends on the top face via the opposite-faces
      rule: 7 − 2 = 5. The front face (3) is extra information that
      doesn't change the answer.
    trap: "4 (which is 7 − 3) finds the number opposite the FRONT face instead of the top face — the question asks about the bottom, which is opposite the top."

  - id: dice-007
    difficulty: 0.40
    estimatedSeconds: 50
    question: "A die (opposite faces sum to 7) is rolled twice. The first time it shows 4 on top, the second time it shows 1 on top. What is the difference between the two bottom-face numbers?"
    options: ["1", "2", "3", "4"]
    answer: 2
    explanation: >
      First roll: bottom = 7 − 4 = 3. Second roll: bottom = 7 − 1 = 6.
      Difference: 6 − 3 = 3.
    trap: "2 slips in the second subtraction — reading 7 − 1 as 5 instead of 6 — so always work out each bottom face fully (3 and 6) before subtracting them."

  - id: dice-008
    difficulty: 0.45
    estimatedSeconds: 50
    question: "A standard die (opposite faces sum to 7) shows 1 on top. It is then tipped over onto its right face, so that face is now on top. If 3 was on the right face before tipping, what number is on the bottom now?"
    options: ["1", "3", "4", "6"]
    answer: 2
    explanation: >
      After tipping, the new top face is what used to be the right face:
      3. The new bottom is opposite the new top: 7 − 3 = 4.
    trap: "1 reuses the ORIGINAL top face — but the die has been tipped over, so a new face is now on top and the bottom must be recalculated from that new top, not the old one."
