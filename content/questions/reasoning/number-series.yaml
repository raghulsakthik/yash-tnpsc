topic: reasoning.number-series
language: en
source: authored
# No prerequisite edges — pattern recognition, not the arithmetic chain.
questions:
  - id: number-series-001
    difficulty: 0.15
    estimatedSeconds: 25
    question: "Find the next number: 2, 4, 6, 8, ?"
    options: ["9", "10", "11", "12"]
    answer: 1
    explanation: "Each term increases by 2: 8 + 2 = 10."
    trap: "9 breaks the +2 pattern — it's only one more than 8, not two."

  - id: number-series-002
    difficulty: 0.15
    estimatedSeconds: 25
    question: "Find the next number: 5, 10, 15, 20, ?"
    options: ["22", "24", "25", "30"]
    answer: 2
    explanation: "Each term increases by 5: 20 + 5 = 25."
    trap: "30 jumps by 10 instead of continuing the established step of 5."

  - id: number-series-003
    difficulty: 0.20
    estimatedSeconds: 35
    question: "Find the missing number: 3, 6, 12, 24, ?"
    options: ["36", "40", "48", "30"]
    answer: 2
    explanation: "Each term doubles the one before it: 24 × 2 = 48."
    trap: "36 continues an ADDING pattern (+12 each time, matching the first couple of gaps by coincidence) rather than the actual DOUBLING pattern the later terms reveal."

  - id: number-series-004
    difficulty: 0.25
    estimatedSeconds: 35
    question: "Find the next number: 1, 4, 9, 16, 25, ?"
    options: ["30", "36", "49", "32"]
    answer: 1
    explanation: "These are perfect squares: 1², 2², 3², 4², 5², so the next is 6² = 36."
    trap: "30 continues the DIFFERENCES (3, 5, 7, 9...) by adding 5 again at the wrong point in the pattern instead of recognising the squares and computing 6² directly."

  - id: number-series-005
    difficulty: 0.35
    estimatedSeconds: 50
    question: "Find the missing number: 2, 5, 10, 17, 26, ?"
    options: ["35", "36", "37", "39"]
    answer: 2
    explanation: >
      Each term is one more than a perfect square: 1²+1, 2²+1, 3²+1,
      4²+1, 5²+1. The next is 6²+1 = 37. (The differences between terms —
      3, 5, 7, 9, 11 — confirm it: the next difference is 11, and
      26 + 11 = 37.)
    trap: "35 continues the difference pattern by adding 9 again instead of the next odd number, 11."

  - id: number-series-006
    difficulty: 0.30
    estimatedSeconds: 35
    question: "Find the next term: 1, 1, 2, 3, 5, 8, ?"
    options: ["11", "12", "13", "10"]
    answer: 2
    explanation: "This is the Fibonacci sequence — each term is the sum of the two before it: 5 + 8 = 13."
    trap: "11 comes from adding a constant gap (3) seen between a couple of earlier terms, rather than the actual rule: each term is the SUM of the two preceding ones."

  - id: number-series-007
    difficulty: 0.30
    estimatedSeconds: 35
    question: "Find the missing number: 7, 14, 28, 56, ?"
    options: ["84", "98", "112", "100"]
    answer: 2
    explanation: "Each term doubles the one before: 56 × 2 = 112."
    trap: "84 adds 28 instead of doubling — it matches the first gap (7 to 14 is +7, but 14 to 28 is +14) only if the growing gap pattern is misread as staying constant."

  - id: number-series-008
    difficulty: 0.40
    estimatedSeconds: 45
    question: "Find the next number: 100, 90, 81, 73, ?"
    options: ["65", "66", "67", "64"]
    answer: 1
    explanation: >
      The gaps between terms shrink by 1 each time: −10, −9, −8, so the
      next gap is −7, giving 73 − 7 = 66.
    trap: "65 applies the previous gap (−8) again instead of continuing the pattern of the gap itself shrinking by one each step."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: number-series-009
    difficulty: 0.45
    estimatedSeconds: 70
    source: tnpsc-2013
    year: 2013
    question: "In each figure, two numbers sit side by side in boxes below a single number in a box above them. Row 1: 1 and 2 below, 5 above. Row 2: 2 and 3 below, 13 above. Row 3: 3 and 4 below, 25 above. Row 4: 4 and 5 below, ? above. Find the missing number."
    options: ["41", "35", "30", "28"]
    answer: 0
    explanation: >
      The top number is the sum of the squares of the two bottom numbers:
      1² + 2² = 5, 2² + 3² = 13, 3² + 4² = 25. So 4² + 5² = 16 + 25 = 41.
    trap: "28 comes from adding the two numbers and doubling (4+5=9, not matching any clean rule) rather than squaring each one first — check the rule against all three given rows before applying it to the fourth."

  - id: number-series-010
    difficulty: 0.50
    estimatedSeconds: 75
    source: tnpsc-2013
    year: 2013
    question: "In each circle, four numbers sit at the top-left, top-right, bottom-left and bottom-right, surrounding a central number. Circle 1: top-left 5, top-right 3, bottom-left 2, bottom-right 4, centre 26. Circle 2: top-left 4, top-right 2, bottom-left 5, bottom-right 8, centre 42. Circle 3: top-left 3, top-right 1, bottom-left 8, bottom-right ?, centre 44. Find the missing number."
    options: ["12", "18", "16", "24"]
    answer: 0
    explanation: >
      The centre is (top-left × bottom-right) + (top-right × bottom-left).
      Check circle 1: (5×4) + (3×2) = 20 + 6 = 26 ✓. Circle 2:
      (4×8) + (2×5) = 32 + 10 = 42 ✓. Circle 3: (3×?) + (1×8) = 44, so
      3×? = 36, giving ? = 12.
    trap: "18 comes from testing the rule against only one of the two given circles instead of both — always confirm a pattern holds for every example before applying it to the unknown one."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: number-series-011
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2024
    year: 2024
    question: "Find the missing number in the series: 4, 18, ?, 100, 180, 294, 448."
    options: ["48", "50", "58", "60"]
    answer: 0
    explanation: >
      Each term follows n(n+1)²: 1×4=4, 2×9=18, 3×16=48, 4×25=100,
      5×36=180, 6×49=294, 7×64=448 — a clean fit confirmed by every known
      term, not just the ones next to the gap.
    trap: "58 comes from fitting a pattern using only the nearby terms (100, 180) rather than checking it against every given term, including the ones further away (4, 18, 294, 448)."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: number-series-012
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2015
    year: 2015
    question: "Find the missing number: 4242, 4254, 4230, 4266, 4218, 4278, ?"
    options: ["4264", "4272", "4228", "4206"]
    answer: 3
    explanation: >
      The differences between terms alternate in sign and grow by 12 each
      time: +12, −24, +36, −48, +60, and so the next difference is −72.
      4278 − 72 = 4206.
    trap: "4264 continues with another +12-style small step instead of spotting that the differences alternate sign AND grow in size by a fixed amount each time."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: number-series-013
    difficulty: 0.50
    estimatedSeconds: 70
    source: tnpsc-2016
    year: 2016
    question: "If 5⊕3 = 34 and 6⊕2 = 40, then the value of 7⊕1 is"
    options: ["54", "34", "50", "30"]
    answer: 2
    explanation: >
      Testing a⊕b = a² + b²: 5² + 3² = 25 + 9 = 34 ✓, and
      6² + 2² = 36 + 4 = 40 ✓. Applying the same rule: 7⊕1 =
      7² + 1² = 49 + 1 = 50.
    trap: "34 just repeats the first given result instead of applying the confirmed rule (a² + b²) to the new pair 7 and 1."

  - id: number-series-014
    difficulty: 0.50
    estimatedSeconds: 75
    source: tnpsc-2016
    year: 2016
    question: "Find out the odd number in the series given: 25, 36, 49, 81, 121, 169, 225"
    options: ["36", "49", "169", "225"]
    answer: 0
    explanation: >
      Every term is a perfect square: 5², 6², 7², 9², 11², 13², 15². All
      the bases except one are ODD numbers (5, 7, 9, 11, 13, 15) — 6 is
      the only even base, which makes 36 the odd one out.
    trap: "169 and 225 are both perfect squares just like every other term, so being 'a square' alone doesn't mark them as the exception — the real pattern to check is whether each square's BASE is odd, and only 36's base (6) breaks that."
