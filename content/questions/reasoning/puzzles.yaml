# No prerequisite edges — an independent skill.
questions:
  - id: puzzles-001
    difficulty: 0.20
    estimatedSeconds: 35
    question: "In a class, Meena is 7th from the top and 15th from the bottom. How many students are there in the class?"
    options: ["20", "21", "22", "23"]
    answer: 1
    explanation: >
      Total = (position from top) + (position from bottom) − 1, since
      Meena herself is counted in both: 7 + 15 − 1 = 21.
    trap: "22 forgets to subtract the 1 for Meena, who gets counted once in 'from the top' and once in 'from the bottom'."

  - id: puzzles-002
    difficulty: 0.25
    estimatedSeconds: 40
    question: "Raju is older than Mani but younger than Suresh. Mani is older than Vijay. Who is the youngest?"
    options: ["Suresh", "Raju", "Mani", "Vijay"]
    answer: 3
    explanation: "Order from oldest to youngest: Suresh, Raju, Mani, Vijay. Vijay is the youngest."
    trap: "Mani looks young at first glance since Raju is older than Mani, but Vijay is established as younger than Mani specifically, one step further down."

  - id: puzzles-003
    difficulty: 0.30
    estimatedSeconds: 55
    question: "A father is 24 years older than his son. In 2 years, the father will be three times as old as the son. What is the son's present age?"
    options: ["8", "10", "12", "14"]
    answer: 1
    explanation: >
      Let the son's age be x; the father's is x + 24. In 2 years:
      x + 26 = 3(x + 2), so x + 26 = 3x + 6, giving 2x = 20, x = 10. Check:
      son 12, father 36 in 2 years, and 36 = 3 × 12.
    trap: "12 is the son's age in 2 years, not now — it's easy to solve the equation correctly and then report the wrong year's answer."

  - id: puzzles-004
    difficulty: 0.30
    estimatedSeconds: 35
    question: "In a row of boys, Arjun is 12th from the left and 18th from the right. How many boys are in the row?"
    options: ["28", "29", "30", "31"]
    answer: 1
    explanation: "Total = 12 + 18 − 1 = 29, since Arjun is counted in both positions."
    trap: "30 adds the two positions without subtracting the 1 for Arjun being counted twice."

  - id: puzzles-005
    difficulty: 0.40
    estimatedSeconds: 60
    question: "Five boxes P, Q, R, S and T are stacked one above another. R is at the top and T is at the bottom. P is directly below R. Q is directly above T. Which box is exactly in the middle (third from the top)?"
    options: ["P", "Q", "S", "T"]
    answer: 2
    explanation: >
      Top to bottom: R (given top), P (directly below R), then the middle
      slot, then Q (directly above T), then T (given bottom). The only box
      left for the only slot left — the middle — is S.
    trap: "It's tempting to guess Q for the middle since it isn't pinned to the very top or bottom by name — but Q is explicitly pinned to the slot directly above T, which is the second-from-bottom, not the middle."

  - id: puzzles-006
    difficulty: 0.45
    estimatedSeconds: 50
    question: "In a queue, Vimal is 15th from the front and 23rd from the back. If 5 more people join the queue behind Vimal, what is Vimal's new position from the back?"
    options: ["18", "23", "28", "33"]
    answer: 2
    explanation: >
      People joining BEHIND Vimal don't change his position from the
      front, but they do add to the count behind him: 23 + 5 = 28.
    trap: "23 assumes nothing changes, forgetting that new people joining behind Vimal directly increases his 'from the back' count."

  - id: puzzles-007
    difficulty: 0.50
    estimatedSeconds: 60
    question: "Sita is twice as old as her brother Ravi. Five years ago, Sita was three times as old as Ravi was then. Find Ravi's present age."
    options: ["8", "10", "12", "15"]
    answer: 1
    explanation: >
      Let Ravi's age be x now, so Sita's is 2x. Five years ago:
      2x − 5 = 3(x − 5), giving 2x − 5 = 3x − 15, so x = 10. Check: 5 years
      ago, Sita was 15 and Ravi was 5, and 15 = 3 × 5.
    trap: "20 (Sita's current age) is a tempting answer if the question is misread — it asks for Ravi's age, not Sita's."

  - id: puzzles-008
    difficulty: 0.55
    estimatedSeconds: 60
    question: "Four friends A, B, C and D sit around a circular table facing the centre. B is immediately to the right of A. C is directly opposite A. Who is immediately to the left of A?"
    options: ["B", "D", "C", "Cannot be determined"]
    answer: 1
    explanation: >
      With 4 seats around the table: A, then B immediately to A's right,
      then C directly opposite A (two seats away), and the only seat and
      person left — immediately to A's left — is D.
    trap: "C is opposite A, which some mistake for 'facing' in a loose sense that gets confused with being adjacent — opposite and adjacent are different positions around the table."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: puzzles-009
    difficulty: 0.45
    estimatedSeconds: 70
    source: tnpsc-2013
    year: 2013
    question: "Five articles A, B, C, D and E are priced differently, and C costs ₹100. A is cheaper than C but costlier than B. E is costlier than C but cheaper than D. Which article is the costliest?"
    options: ["B", "C", "D", "E"]
    answer: 2
    explanation: >
      From the clues: B < A < C, and C < E < D. Chaining everything
      together: B < A < C < E < D. D is the costliest.
    trap: "E is tempting since it's explicitly described as costing more than C — but D is described as costing even more than E, one step further up the chain."

  # A real TNPSC past-year question below, transcribed from a scanned paper
  # and independently re-solved (never trusted from the paper's own annotations).
  - id: puzzles-010
    difficulty: 0.60
    estimatedSeconds: 90
    source: tnpsc-2024
    year: 2024
    question: "Reaching the meeting place 20 minutes before 8.50, Sunil found himself thirty minutes earlier than a man who came 40 minutes late. What was the scheduled time of the meeting?"
    options: ["8.00", "8.05", "8.10", "8.20"]
    answer: 3
    explanation: >
      Sunil arrived at 8.50 − 20 min = 8.30. The late man arrived 30
      minutes after Sunil: 8.30 + 30 min = 9.00. Since that man was 40
      minutes late, the scheduled time was 9.00 − 40 min = 8.20.
    trap: "8.10 mixes up which direction the 30-minute gap goes — Sunil arrived BEFORE the late man, so the late man's arrival time is Sunil's time PLUS 30 minutes, not minus."

  # Real TNPSC past-year questions below, transcribed from scanned papers and
  # independently re-solved (never trusted from the paper's own annotations).
  - id: puzzles-011
    difficulty: 0.45
    estimatedSeconds: 65
    source: tnpsc-2015
    year: 2015
    question: "A is richer than B. C is richer than A. D is richer than C. E is the richest of all. If they are seated in order of richness, who is in the central position?"
    options: ["A", "B", "C", "D"]
    answer: 2
    explanation: >
      Richest to poorest: E, D, C, A, B. With 5 people, the central
      (3rd) position is C.
    trap: "A is tempting since A appears first in the clues, but the clues only establish A's rank relative to B and C — working through the full chain puts A 4th, not in the middle."

  - id: puzzles-012
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2015
    year: 2015
    question: "Mohan started from point P and walked 2 m towards west. He then took a right turn and walked 3 m, then a left turn and walked 5 m, then a final left turn and walked 3 m, stopping at point Q. How far is Q from P?"
    options: ["2 m", "6 m", "7 m", "8 m"]
    answer: 2
    explanation: >
      Tracking direction changes from facing west: right turn → facing
      north (walk 3 m), left turn → facing west (walk 5 m), left turn →
      facing south (walk 3 m). North-south movements cancel (+3, then
      −3). East-west movements are 2 m west then 5 m west, both the same
      direction: 2 + 5 = 7 m west in total. Q is 7 m from P.
    trap: "8 m adds up every leg of the walk (2+3+5+3=13, not even an option, but close variants like this) instead of tracking which legs point the same direction and which cancel out."

  - id: puzzles-013
    difficulty: 0.55
    estimatedSeconds: 80
    source: tnpsc-2015
    year: 2015
    question: "Richard is fifteenth from the front in a column of boys. There were thrice as many behind him as there were in front. How many boys are there between Richard and the seventh boy from the end of the column?"
    options: ["33", "34", "35", "36"]
    answer: 2
    explanation: >
      14 boys are in front of Richard, so 3 × 14 = 42 are behind him.
      Total boys: 14 + 1 + 42 = 57. The seventh from the end is at
      position 57 − 7 + 1 = 51. Richard is at position 15. Boys strictly
      between positions 15 and 51: 51 − 15 − 1 = 35.
    trap: "36 forgets to exclude Richard and the seventh boy themselves from the count — the question asks for boys BETWEEN the two, not the full gap including both endpoints."
