  - { topic: aptitude.hcf,                  requires: aptitude.division,            strength: 0.70 }
  - { topic: aptitude.simple-interest,      requires: aptitude.percentage,          strength: 0.90 }
  - { topic: aptitude.compound-interest,    requires: aptitude.simple-interest,     strength: 0.85 }
  - { topic: aptitude.time-and-work,        requires: aptitude.fractions,           strength: 0.75 }
