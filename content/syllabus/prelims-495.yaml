# TNPSC Combined Civil Services (Preliminary) Examination – II
# Group II and Group IIA Services. Code 495, dated 12.12.2024.
#
# 200 questions in one paper:
#   General Studies            75  (degree standard)
#   Aptitude and Mental Ability 25  (SSLC standard)
#   Language                  100  (SSLC standard, General Tamil OR General English)
#
# question_count on each chapter is the official count from the paper. It is the
# only input to examWeight in topic selection — never invent a weight.
#
# transcribed: false means the unit's prose has not yet been split into topics.
# The validator reports coverage; it does not fail the build on it.

exam: tnpsc-prelims-495
curriculum_id: tnpsc-prelims-495
exam_group: TNPSC_GROUP_2_2A
