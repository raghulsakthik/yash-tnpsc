services:
  db:
    image: postgres:16
    container_name: yash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yash
      POSTGRES_PASSWORD: yash
      POSTGRES_DB: yash
    ports:
      - "5432:5432"
    volumes:
      - yash-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yash -d yash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yash-pgdata:
